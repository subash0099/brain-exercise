  let save = loadSave();
  function persistSave(){
    // Always write locally first (instant, works offline).
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
    // Then debounce a write up to Firestore, if signed in.
    if(cloudSyncEnabled && firebaseUid){
      clearTimeout(cloudSaveTimeout);
      cloudSaveTimeout = setTimeout(function(){
        fbDb.collection('users').doc(firebaseUid).set(save, { merge:true }).catch(function(err){
          console.warn('Cloud save failed, progress still kept locally:', err);
        });
      }, 1200);
    }
  }

  async function initFirebaseAndLogin(){
    try{
      if(FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") return; // not configured yet
      if(!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData) return;

        return LEVEL_BADGES_ASC.findIndex(function(b){ return b.min === LEVEL_BADGES[i].min; });
      }
    }
    return -1;
  }

  // Earned wins are never erased - this only softens the CURRENT badge/difficulty.
  function effectiveTierIndex(){
    const t = trueTierIndex();
    if(t < 0) return -1;
    return Math.max(0, t - (save.rankDemotion || 0));
  }
  function getLevelBadge(){
    const idx = effectiveTierIndex();
    return idx >= 0 ? LEVEL_BADGES_ASC[idx] : null;
  }

  // ---- rank strip: 5 visible, drag left/right to see the rest ----
  const RANK_VISIBLE = 5;
  let rankStepW = 0, rankOffset = 0, rankDrag = null, rankMarks = null;
  function buildRankStrip(){
    const track = document.getElementById('rankStripTrack');
    if(!track) return;
    track.innerHTML = '';
    const cur = currentRankIndex();
    RANK_LADDER.forEach(function(r, i){
      const d = document.createElement('div');
      d.className = 'rank-step' + (i === cur ? ' current' : (i < cur ? ' earned' : ' unearned'));
      d.innerHTML =
        '<div class="rank-step-badge">' +
          '<div class="rank-star" style="background:linear-gradient(135deg,' + r.c1 + ',' + r.c2 + ')"></div>' +
          '<div class="rank-core" style="border-color:' + r.c1 + '">' + r.icon + '</div>' +
        '</div>' +
        '<div class="rank-step-name">' + r.name + '</div>' +
        '<div class="rank-step-wins">' + r.wins + (r.wins === 1 ? ' win' : ' wins') + '</div>';
      track.appendChild(d);
    });
  }
  function layoutRankStrip(){
    const wrap = document.getElementById('rankStripWrap');
    const track = document.getElementById('rankStripTrack');
    if(!wrap || !track) return;
    const w = wrap.clientWidth;
    if(w < 50) return;                    // panel not visible yet
    rankStepW = Math.floor(w / RANK_VISIBLE);
    Array.prototype.forEach.call(track.children, function(ch){ ch.style.width = rankStepW + 'px'; });
    const maxStart = RANK_LADDER.length - RANK_VISIBLE;
    const start = Math.max(0, Math.min(maxStart, currentRankIndex() - 2));
    rankOffset = -start * rankStepW;
    track.style.transition = 'none';
    track.style.transform = 'translateX(' + rankOffset + 'px)';
  }
  function rankAxisInfo(){
    const wrap = document.getElementById('rankStripWrap');
    if(!wrap) return null;
    if(!rankMarks){
      rankMarks = [document.createElement('div'), document.createElement('div')];
      rankMarks.forEach(function(m, i){
        m.style.cssText = 'position:absolute;top:0;left:' + (i ? '100%' : '0') + ';width:0;height:0;pointer-events:none;';
        wrap.appendChild(m);
      });
    }
    const r0 = rankMarks[0].getBoundingClientRect();
    const r1 = rankMarks[1].getBoundingClientRect();
    const dx = r1.left - r0.left, dy = r1.top - r0.top;
    const len = Math.sqrt(dx * dx + dy * dy);
    if(len < 1 || wrap.clientWidth < 50) return null;
    return { x0: r0.left, y0: r0.top, ux: dx / len, uy: dy / len, perLocal: wrap.clientWidth / len };
  }
  function rankDragStart(x, y){
    const a = rankAxisInfo();
    if(!a) return;
    document.getElementById('rankStripTrack').style.transition = 'none';
    rankDrag = { a: a, p0: x * a.ux + y * a.uy, off0: rankOffset };
  }
  function rankDragMove(x, y){
    if(!rankDrag || rankStepW < 10) return;
    const a = rankDrag.a;
    const proj = (x * a.ux + y * a.uy) - rankDrag.p0;  // screen px along the strip axis
    const local = proj * a.perLocal;                   // -> local px (rotation/scale safe)
    const minOff = -(RANK_LADDER.length - RANK_VISIBLE) * rankStepW;
    rankOffset = Math.max(minOff - 30, Math.min(30, rankDrag.off0 + local));
    document.getElementById('rankStripTrack').style.transform = 'translateX(' + rankOffset + 'px)';
  }
  function rankDragEnd(){
    if(!rankDrag) return;
    rankDrag = null;
    if(rankStepW < 10) return;
    const maxStart = RANK_LADDER.length - RANK_VISIBLE;
    const idx = Math.max(0, Math.min(maxStart, Math.round(-rankOffset / rankStepW)));
    rankOffset = -idx * rankStepW;
    const track = document.getElementById('rankStripTrack');
    track.style.transition = 'transform .25s ease-out';
    track.style.transform = 'translateX(' + rankOffset + 'px)';
  }
  (function(){
    const wrap = document.getElementById('rankStripWrap');
    if(!wrap) return;
    wrap.addEventListener('mousedown', function(e){ e.preventDefault(); rankDragStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e){ rankDragMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', rankDragEnd);
    wrap.addEventListener('touchstart', function(e){ rankDragStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    wrap.addEventListener('touchmove', function(e){ e.preventDefault(); rankDragMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    wrap.addEventListener('touchend', rankDragEnd);
    wrap.addEventListener('touchcancel', rankDragEnd);
  })();

  /**

  function watchAdForCoins(onComplete, grantCoins){
    if(grantCoins === undefined) grantCoins = true;
    // Real Monetag rewarded ad (zone 11885548). Monetag's SDK shows its own
    // full-screen ad UI and resolves the promise once it's been watched.

    }, 1000);
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function makeQuestion(level, tier, rankBoost){
    level = level || 'normal';
    tier = tier || 0;   // 0 = normal, 1 = harder (20+ solved), 2 = advanced ops unlocked (30+ solved)
    const boost = (tier >= 2 ? 1.8 : (tier >= 1 ? 1.35 : 1)) * (rankBoost || 1);

    // Once the match has gone on a while, mix in square / cube / square-root questions
    if(tier >= 2 && level !== 'easy' && Math.random() < 0.35) return makeAdvancedQuestion(level);

    let op;
    if(level === 'easy') op = Math.random() < 0.7 ? '+' : '-';
    else if(level === 'hard') op = Math.random() < 0.6 ? (Math.random() < 0.5 ? '×' : '÷') : (Math.random() < 0.5 ? '+' : '-');
    else op = ['+','-','×','÷'][randInt(0,3)];

    let a,b,answer,text;
    if(op === '+'){
      if(level === 'easy'){ a = randInt(2, Math.round(12*boost)); b = randInt(2, Math.round(12*boost)); }
      else if(level === 'hard'){ a = randInt(15, Math.round(60*boost)); b = randInt(15, Math.round(60*boost)); }
      else { a = randInt(2, Math.round(30*boost)); b = randInt(2, Math.round(30*boost)); }
      answer = a+b; text = a+' + '+b;
    } else if(op === '-'){
      if(level === 'easy'){ a = randInt(5, Math.round(15*boost)); b = randInt(1,a); }
      else if(level === 'hard'){ a = randInt(30, Math.round(70*boost)); b = randInt(1,a); }
      else { a = randInt(5, Math.round(40*boost)); b = randInt(1,a); }
      answer = a-b; text = a+' − '+b;
    } else if(op === '×'){
      if(level === 'easy'){ a = randInt(2, Math.round(6*boost)); b = randInt(2, Math.round(5*boost)); }
      else if(level === 'hard'){ a = randInt(6, Math.round(15*boost)); b = randInt(6, Math.round(12*boost)); }
      else { a = randInt(2, Math.round(12*boost)); b = randInt(2, Math.round(10*boost)); }
      answer = a*b; text = a+' × '+b;
    } else {
      if(level === 'easy'){ b = randInt(2, Math.round(5*boost)); answer = randInt(2, Math.round(6*boost)); a = b*answer; }
      else if(level === 'hard'){ b = randInt(6, Math.round(12*boost)); answer = randInt(6, Math.round(14*boost)); a = b*answer; }
      else { b = randInt(2, Math.round(10*boost)); answer = randInt(2, Math.round(12*boost)); a = b*answer; }
      text = a+' ÷ '+b;
    }
    return {text:text, answer:String(answer), op:op, a:a, b:b};
  }

  function makeAdvancedQuestion(level){
    const type = ['square','cube','sqrt'][randInt(0,2)];
    const big = level === 'hard';
    let a, answer, text, op;
    if(type === 'square'){
      a = big ? randInt(11,20) : randInt(2,15); answer = a*a; text = a+'²'; op = 'sq';
    } else if(type === 'cube'){
      a = big ? randInt(6,10) : randInt(2,8); answer = a*a*a; text = a+'³'; op = 'cube';
    } else {
      a = big ? randInt(11,18) : randInt(2,15); answer = a; text = '√'+(a*a); op = 'sqrt';
    }
    return {text:text, answer:String(answer), op:op, a:a, b:0};
  }

  // Progression: as the match goes on, questions gradually get harder for BOTH
  // players, in both Play with Friend and Play Online — then advanced ops unlock.
  function currentTier(){
    if(totalSolved >= 30) return 2;   // square / cube / square-root start appearing
    if(totalSolved >= 20) return 1;   // bigger numbers on the standard ops
    return 0;
  }

  function newRound(){
    if(gameOver) return;
    roundActive = true;
    answerA = ''; answerB = '';
    wrongStreakA = 0;
    aiHandicappedThisRound = false;
    roundStartTime = performance.now();

    // Rank sets the BASE difficulty in Online mode (Starter=easy ... Warlord=hardest).
    // Friend mode always stays at plain 'normal' - rank doesn't apply there.
    const rd = (mode === 'online') ? rankDifficulty() : { level:'normal', boost:1 };
    let levelA = rd.level, levelB = rd.level, boostA = rd.boost, boostB = rd.boost;
    if(mode === 'online' && helpUserNextRound){
      levelA = 'easy'; boostA = 1;   // user was struggling last round — give them a breather
      levelB = 'hard'; boostB = 1;   // AI genuinely gets a harder sum, which naturally slows it down
      helpUserNextRound = false;
    } else if(mode === 'online' && hardBurstRounds > 0){
      levelA = 'hard'; boostA = 1;   // early hot streak — challenge the user for a couple of rounds
      hardBurstRounds--;
    }
    const tier = currentTier();
    qA = makeQuestion(levelA, tier, boostA);
    qB = makeQuestion(levelB, tier, boostB);
    qAEl.textContent = qA.text + ' = ?';
    qBEl.textContent = qB.text + ' = ?';
    ansAEl.textContent = ''; ansAEl.className = 'answer-box';
    ansBEl.textContent = ''; ansBEl.className = 'answer-box';
    const dotA = document.getElementById('dotA');
    const dotB = document.getElementById('dotB');
    if(dotA) dotA.textContent = (qA.op === 'sqrt') ? '√' : '.';
    if(dotB) dotB.textContent = (qB.op === 'sqrt') ? '√' : '.';
    startTimer();
    if(mode === 'online') scheduleAI(levelB === 'hard');
    else showThinking(false);
  }

  // ---- AI opponent (Play Online mode) : speed adapts to how the user is actually playing ----
  // Genuinely randomized — no fixed "addition = X seconds" rule, so it doesn't
  // feel mechanical. Slightly weighted by how big the numbers are and by how
  // the user is doing, but the spread is wide enough that no two questions
  // (even the same type) play out the same way.
  function aiThinkTime(q, assist){
    const totalTries = userCorrectCount + userWrongCount;
    const missRate = totalTries ? (userWrongCount / totalTries) : 0;

    const digits = String(q.a).length + (q.b ? String(q.b).length : 0);
    let baseTime = randInt(1800, 6200) + digits * randInt(250, 550);
    baseTime += missRate * randInt(700, 2600);           // user struggling → AI eases off, unpredictably
    if(assist) baseTime += 1800 + randInt(300, 2200);     // mid-round comeback assist
    const extraSlip = missRate * 0.35;

    return { time: Math.max(1200, Math.min(baseTime, 12000)), extraSlip: extraSlip };
  }

  function scheduleAI(assist){
    clearTimeout(aiTimeout);
    if(mode !== 'online') return;
    showThinking(true);
    const think = aiThinkTime(qB, assist);
    const baseTime = think.time;
    const makesSlip = Math.random() < Math.min(0.85, (assist ? 0.55 : 0.22) + think.extraSlip);

    if(makesSlip){
      const slipDelay = Math.max(600, baseTime - 900);
      aiTimeout = setTimeout(function(){
        if(!roundActive || gameOver || mode !== 'online') return;
        const correctNum = parseInt(qB.answer, 10);
        const delta = randInt(1,3) * (Math.random() < 0.5 ? -1 : 1);
        const wrongVal = String(Math.max(0, correctNum + delta));
        answerB = wrongVal;
        ansBEl.textContent = wrongVal;
        submitAnswer('B');
        aiTimeout = setTimeout(function(){
          if(!roundActive || gameOver || mode !== 'online') return;
          answerB = qB.answer;
          ansBEl.textContent = answerB;
          showThinking(false);
          submitAnswer('B');
        }, 500 + randInt(200,600));
      }, slipDelay);
    } else {
      aiTimeout = setTimeout(function(){
        if(!roundActive || gameOver || mode !== 'online') return;
        answerB = qB.answer;
        ansBEl.textContent = answerB;
        showThinking(false);
        submitAnswer('B');
      }, baseTime);
    }
  }

  let lastTickSec = -1;
  function startTimer(){
    cancelAnimationFrame(timerRAF);
    timerStart = performance.now();
    lastTickSec = -1;
    function tick(now){
      if(!roundActive) return;
      const left = Math.max(0, ROUND_TIME - (now - timerStart));
      timerFill.style.width = (left / ROUND_TIME * 100) + '%';
      const secLeft = Math.ceil(left/1000);
      timeText.textContent = '00:' + String(secLeft).padStart(2,'0');
      if(secLeft <= 3 && secLeft !== lastTickSec){ lastTickSec = secLeft; SFX.tick(); }
      if(left <= 0){
        if(mode === 'online'){ userRoundStreak = 0; userMissStreak++; }
        newRound();
        return;
      }
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function submitAnswer(side){
    if(!roundActive || gameOver) return;
    const val   = side === 'A' ? answerA : answerB;
    const q     = side === 'A' ? qA : qB;
    const ansEl = side === 'A' ? ansAEl : ansBEl;
    if(val === '') return;

    if(val === q.answer){
      // Pity guard: eases the AI off the finishing pull a couple of times so a
      // fresh player isn't steamrolled — but it can only block a HANDFUL of
      // genuine correct finishes. Keep solving and the AI WILL close it out.
      if(side === 'B' && pityActive && (position + 1) >= LIMIT && pityBlocksUsed < 2){
        pityBlocksUsed++;
        SFX.wrong();
        ansEl.textContent = val;
        ansEl.className = 'answer-box bad';
        setTimeout(function(){
          ansEl.className = 'answer-box';
          answerB = ''; ansBEl.textContent = '';
        }, 340);
        return;
      }

      roundActive = false;
      cancelAnimationFrame(timerRAF);
      SFX.correct();
      ansEl.className = 'answer-box ok';
      const box = side === 'A' ? padBoxA : padBoxB;
      box.classList.add('flash');
      setTimeout(function(){ box.classList.remove('flash'); }, 500);

      if(side === 'A'){
        solvedA++;
        position = Math.max(-LIMIT, position - 1);
        wrongStreakA = 0;
        chancesLeftA = 3;
        userCorrectCount++;
        const elapsed = performance.now() - roundStartTime;
        userTimeSamples.push(elapsed);
        if(userTimeSamples.length > 5) userTimeSamples.shift();

        // ---- reward: career stats + badges (coins now only come from wins/ads) ----
        save.careerCorrect++;
        perfectStreakCount++;
        if(elapsed <= 5000) save.gotSpeed = true;
        if(perfectStreakCount >= 5) save.gotPerfect = true;
        checkBadges();
        // From the 3rd game onward, playing well enough (25+ solved) earns the win
        if(mode === 'online' && userGamesPlayed >= 3 && solvedA >= 25) pityActive = true;

        if(mode === 'online'){
          userMissStreak = 0;
          userRoundStreak++;
          // Early hot streak (still under ~6-7 solved) — throw a couple of hard ones in
          if(userRoundStreak >= 3 && solvedA <= 8) hardBurstRounds = 2;
        }
      } else {
        solvedB++;
        position = Math.min(LIMIT, position + 1);
        if(mode === 'online'){
          userRoundStreak = 0;
          userMissStreak++;
          // Well into the match but cold for 3 rounds straight — let the AI actually close it out
          if(userMissStreak >= 3 && solvedA > 20) pityActive = false;
        }
      }
      totalSolved++;
      updateVisual();
      setTimeout(function(){
        if(Math.abs(position) >= LIMIT) endGame(position < 0 ? 'A' : 'B');
        else newRound();
      }, 620);
    } else {
      SFX.wrong();
      ansEl.textContent = val;
      ansEl.className = 'answer-box bad';
      if(side === 'A'){
        wrongStreakA++;
        userWrongCount++;
        perfectStreakCount = 0;
        if(wrongStreakA >= 2 && mode === 'online' && !aiHandicappedThisRound && roundActive){
          aiHandicappedThisRound = true;
          helpUserNextRound = true; // next round: easier question for the user, harder for the AI
        }
        chancesLeftA--;
        if(chancesLeftA <= 0){
          setTimeout(function(){
            ansEl.className = 'answer-box';
            answerA = ''; ansAEl.textContent = '';
            showChanceOverlay();
          }, 340);
          return;
        }
      }
      setTimeout(function(){
        ansEl.className = 'answer-box';
        if(side === 'A'){ answerA = ''; ansAEl.textContent = ''; }
        else { answerB = ''; ansBEl.textContent = ''; }
      }, 340);
    }
  }

  function handleKey(side, key){
    if(!roundActive || gameOver) return;
    if(side === 'B' && mode === 'online') return; // AI controls this side in online mode
    SFX.key();
    const q = side === 'A' ? qA : qB;
    if(key === 'dot' && q && q.op === 'sqrt') return; // shows √ for this question — decorative, no input needed

    if(side === 'A'){
      if(key === 'del') answerA = answerA.slice(0,-1);
      else if(answerA.length < 4) answerA += (key === 'dot' ? '.' : key);
      ansAEl.textContent = answerA;
      if(qA && answerA.length === qA.answer.length) submitAnswer('A');
    } else {
      if(key === 'del') answerB = answerB.slice(0,-1);
      else if(answerB.length < 4) answerB += (key === 'dot' ? '.' : key);
      ansBEl.textContent = answerB;
      if(qB && answerB.length === qB.answer.length) submitAnswer('B');
    }
  }

  function buildPad(container, side){
    const keys = ['1','2','3','4','5','6','7','8','9','del','0','dot'];
    container.innerHTML = '';
    keys.forEach(function(k){
      const btn = document.createElement('div');
      btn.className = 'key';
      if(k === 'del'){ btn.classList.add('back'); btn.textContent = '⌫'; }
      else if(k === 'dot'){ btn.classList.add('go'); btn.textContent = '.'; btn.id = 'dot' + side; }
      else btn.textContent = k;
      // touchstart so two players tapping at the same instant both register
      btn.addEventListener('touchstart', function(e){
        e.preventDefault();
        handleKey(side, k);
      }, {passive:false});
      btn.addEventListener('click', function(){ handleKey(side, k); });
      container.appendChild(btn);
    });
  }

  // ---- SFX volume slider: same projection-based drag as the music slider ----
  function sfxSetUI(pct){

    const knob = document.getElementById('sfxKnob');
    if(fill) fill.style.width = pct + '%';

  let sfxDragging = false, sfxSaveTimeout = null, sfxMark0 = null, sfxMark1 = null;
  function ensureSfxMarks(slider){
    if(sfxMark0 && sfxMark1) return;
    sfxMark0 = document.createElement('div');
    sfxMark1 = document.createElement('div');
    [sfxMark0, sfxMark1].forEach(function(m, i){

    const x0 = r0.left, y0 = r0.top;
    const dx = r1.left - x0, dy = r1.top - y0;
    const len2 = dx * dx + dy * dy;
    if(len2 < 1) return;
    let pct = ((clientX - x0) * dx + (clientY - y0) * dy) / len2 * 100;

      watchAdForCoins(function(){
        continueMatch();
      }, false);
    }
  });

  document.getElementById('chestOpenBtn').addEventListener('click', function(){
    addCoins(pendingChestReward);
    chestSubEl.textContent = 'You got ' + pendingChestReward + ' 🪙! Come back after 5 more wins for another chest.';
    this.style.display = 'none';
    setTimeout(function(){
      chestOverlay.classList.remove('show');
      document.getElementById('chestOpenBtn').style.display = 'inline-block';
    }, 1600);
  });

  SFX.setVolume(save.sfxVol != null ? save.sfxVol : 100);
  updateCoinDisplay();
  applyRibbonColor();
  applyLayoutSide();
  updateVisual();
  document.getElementById('mysteryBoxIcon').addEventListener('click', openMysteryBox);
  document.getElementById('mysteryBoxContinueBtn').addEventListener('click', function(){
    document.getElementById('mysteryBoxOverlay').classList.remove('show');
  });

  checkDailyLogin();
  initFirebaseAndLogin();
})();
</script>

</body>
</html>
