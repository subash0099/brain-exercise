<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brain Exercise — Math Tug of War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11885548' data-sdk='show_11885548'></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1F62C9;
    --blue-soft:#3E84E6;
    --red:#D93B3B;
    --navy:#12386B;
    --navy-deep:#0C2748;
    --sky-1:#8FC7F0;
    --sky-2:#C8E6F8;
    --sand:#D9B98A;
    --sand-dark:#BE9968;
    --grass:#6FB23F;
    --grass-dark:#4F8C2B;
    --gold:#F5C542;
    --gold-dark:#D19A16;
    --green-ok:#3BA55D;
    --ink:#0F2440;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--navy-deep);
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--ink);
  }

  /* The game lives on ONE fixed canvas (900 x 560).
     JS scales that whole canvas to fit the screen it opens on,
     so phone / tablet / laptop all see identical proportions. */
  .viewport{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    position:relative;
    width:900px;
    height:560px;
    flex:0 0 auto;
    transform-origin:center center;
    display:flex;
    flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(180deg,
      var(--sky-1) 0%, var(--sky-2) 33%,
      var(--sand) 33%, var(--sand-dark) 63%,
      var(--grass) 63%, var(--grass-dark) 100%);
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }

  /* ---------- TOP HUD ---------- */
  .hud{
    flex:0 0 96px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 14px 0;
  }
  .team-card{
    flex:1 1 0;
    min-width:0;
    border-radius:16px;
    padding:9px 16px 10px;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .team-a{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }
  .team-b{ background:linear-gradient(180deg,#E85C5C,var(--red)); text-align:right; }
  .team-name{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:21px;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .team-score{
    font-size:14px;
    font-weight:700;
    opacity:.95;
    line-height:1.3;
  }
  .pull-bar{
    height:9px;
    border-radius:99px;
    background:rgba(0,0,0,.3);
    overflow:hidden;
    margin-top:5px;
  }
  .pull-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    transition:width .45s ease;
  }
  .team-a .pull-fill{ background:linear-gradient(90deg,#8FE86B,#4FCB2F); }
  .team-b .pull-fill{ background:linear-gradient(90deg,#FF8B6B,#FF5A3C); margin-left:auto; }

  .timer-pod{
    flex:0 0 150px;
    background:linear-gradient(180deg,#2C5A9E,var(--navy));
    border-radius:16px;
    padding:7px 14px 8px;
    text-align:center;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .timer-time{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:26px;
    line-height:1;
  }
  .timer-label{ font-size:11px; opacity:.85; font-weight:700; margin-top:1px; }
  .coin-strip{
    flex:0 0 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
    padding-top:6px;
  }
  .coin-display{
    background:linear-gradient(180deg,#2C5A9E,var(--navy));
    color:var(--gold);
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:14px;
    padding:5px 10px;
    border-radius:99px;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
    white-space:nowrap;
  }
  .reward-chip-btn{
    font-size:20px;
    line-height:1;
    padding:5px 10px;
    border-radius:99px;
    border:2px solid rgba(255,255,255,.5);
    background:linear-gradient(180deg,var(--gold),var(--gold-dark));
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .reward-chip-btn:active{ transform:translateY(2px); box-shadow:none; }
  .coin-toast{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,0);
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:20px;
    color:var(--gold);
    text-shadow:0 2px 3px rgba(0,0,0,.5);
    pointer-events:none;
    z-index:55;
    opacity:0;
  }
  .coin-toast.fly{ animation:coinFly 1.1s ease forwards; }
  @keyframes coinFly{
    0%{ opacity:0; transform:translate(-50%,10px) scale(.8); }
    20%{ opacity:1; transform:translate(-50%,-10px) scale(1.1); }
    75%{ opacity:1; transform:translate(-50%,-46px) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-62px) scale(1); }
  }
  .badge-toast{
    position:absolute;
    left:50%; top:14px;
    transform:translate(-50%,-70px);
    background:linear-gradient(180deg,var(--gold),var(--gold-dark));
    color:var(--navy);
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:14px;
    padding:9px 20px;
    border-radius:99px;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
    z-index:70;
    white-space:nowrap;
    transition:transform .4s cubic-bezier(.34,1.4,.64,1);
  }
  .badge-toast.show{ transform:translate(-50%,0); }
  .timer-track{
    height:5px;
    border-radius:99px;
    background:rgba(0,0,0,.35);
    margin-top:5px;
    overflow:hidden;
  }
  .timer-fill{
    height:100%;
    width:100%;
    background:var(--gold);
    transition:width .1s linear;
  }
  .mini-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    row-gap:4px;
    justify-content:center;
    margin-top:6px;
  }
  .restart-mini{
    display:block;
    margin:0;
    font-family:'Quicksand',sans-serif;
    font-size:11px;
    font-weight:800;
    padding:3px 12px;
    border-radius:99px;
    border:2px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.14);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  .restart-mini:active{ transform:translateY(1px); }
  #muteBtn{ padding:3px 10px; }
  #muteBtn.muted{ opacity:.55; }

  /* ---------- ARENA ---------- */
  .arena{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }

  .q-card{
    position:absolute;
    top:0px;
    background:#fff;
    border:4px solid var(--blue);
    border-radius:16px;
    padding:6px 22px 9px;
    text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.2);
    min-width:180px;
    z-index:5;
  }
  .q-card.q-b{ border-color:var(--red); }
  .q-label{ font-size:12px; font-weight:700; color:#5A7391; line-height:1.2; }
  .q-text{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:30px;
    line-height:1.15;
    color:var(--navy);
    white-space:nowrap;
  }
  .q-a{ left:150px; }
  .q-b{ right:150px; }

  .rope-zone{
    position:absolute;
    left:0; right:0;
    bottom:34px;
    height:0;
  }
  .rope{
    position:absolute;
    left:60px; right:60px;
    top:0;
    height:11px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(72deg,#C79A5E 0 6px,#A87A42 6px 12px);
    border-radius:99px;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.28);
  }
  .ribbon{
    position:absolute;
    top:0;
    width:26px; height:30px;
    transform:translate(-50%,-52%);
    transition:left .5s cubic-bezier(.34,1.4,.64,1);
    z-index:4;
    background:var(--red);
    clip-path:polygon(50% 0,100% 18%,72% 55%,100% 100%,50% 62%,0 100%,28% 55%,0 18%);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
  }

  /* ---------- CONTROLS (bigger now that character space is freed up) ---------- */
  .controls{
    flex:0 0 270px;
    display:flex;
    gap:16px;
    padding:8px 16px 14px;
    background:linear-gradient(180deg,rgba(12,39,72,0) 0%, var(--navy-deep) 16%);
  }
  .pad-box{
    flex:1 1 0;
    min-width:0;
    background:linear-gradient(180deg,#F4F8FE,#DCE8F7);
    border:4px solid var(--blue);
    border-radius:18px;
    padding:8px 10px 10px;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
  }
  .pad-b{ border-color:var(--red); }
  .pad-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:7px;
  }
  .pad-b .pad-head{ flex-direction:row-reverse; }
  .pad-title{
    font-size:14px;
    font-weight:800;
    color:var(--navy);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:120px;
  }
  .pad-stage{ position:relative; }
  .ai-think{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
    background:rgba(255,255,255,.95);
    border-radius:14px;
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:14px;
    color:var(--navy);
    z-index:3;
    padding:6px;
  }
  .ai-think.show{ display:flex; }
  .ai-think .dots::after{
    content:'.';
    animation:dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'.';} 33%{content:'..';} 66%{content:'...';} 100%{content:'.';}
  }
  .answer-box{
    flex:1 1 auto;
    min-width:0;
    background:#fff;
    border:3px solid #B9CEE6;
    border-radius:12px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    letter-spacing:1px;
  }
  .answer-box.ok{ border-color:var(--green-ok); color:var(--green-ok); background:#EDFBF1; }
  .answer-box.bad{ border-color:var(--red); color:var(--red); background:#FDEDED; animation:shake .3s; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    30%{transform:translateX(-7px);}
    70%{transform:translateX(7px);}
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    background:#fff;
    border:3px solid #C3D6EC;
    border-radius:13px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    box-shadow:0 3px 0 #B0C6DF;
  }
  .key:active{ transform:translateY(3px); box-shadow:none; }
  .key.back{ background:var(--navy); color:#fff; border-color:#071A31; box-shadow:0 3px 0 #071A31; font-size:22px; }
  .key.go{ background:var(--green-ok); color:#fff; border-color:#2C8247; box-shadow:0 3px 0 #24693A; font-size:22px; }

  .pad-box.flash{ animation:pop .5s ease; }
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.03);}
    100%{transform:scale(1);}
  }

  /* ---------- WIN OVERLAY ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(8,24,45,.74);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
  }
  .overlay.show{ display:flex; }
  .win-card{
    background:linear-gradient(180deg,#F7FBFF,#DCE9F8);
    border:5px solid var(--gold);
    border-radius:22px;
    padding:24px 40px 26px;
    text-align:center;
    max-width:440px;
    box-shadow:0 10px 0 rgba(0,0,0,.35);
  }
  .win-trophy{ font-size:58px; line-height:1; }
  .win-card h2{
    font-family:'Fredoka',cursive;
    font-size:30px;
    margin:8px 0 4px;
    color:var(--navy);
  }
  .win-card p{ margin:0 0 16px; font-size:15px; color:#4C6A8C; font-weight:600; }
  .play-again{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:19px;
    padding:11px 32px;
    border-radius:99px;
    border:4px solid var(--gold-dark);
    background:var(--gold);
    color:var(--navy);
    cursor:pointer;
    box-shadow:0 5px 0 var(--gold-dark);
  }
  .play-again:active{ transform:translateY(4px); box-shadow:none; }
  .share-btn{
    display:block;
    margin:12px auto 0;
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:15px;
    padding:9px 22px;
    border-radius:99px;
    border:3px solid var(--navy);
    background:linear-gradient(180deg,var(--blue-soft),var(--blue));
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 var(--navy);
  }
  .share-btn:active{ transform:translateY(3px); box-shadow:none; }

  /* ---------- MODE / NAME OVERLAYS ---------- */
  .mode-card{ padding:22px 34px 26px; }
  .mode-btns{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:6px;
  }
  .mode-btn{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:18px;
    padding:13px 20px;
    border-radius:16px;
    border:none;
    cursor:pointer;
    color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
  }
  .mode-btn:active{ transform:translateY(4px); box-shadow:none; }
  .mode-btn-a{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }
  .mode-btn-b{ background:linear-gradient(180deg,#E85C5C,var(--red)); }
  .mode-sub{ font-size:12px; opacity:.85; font-weight:600; margin-top:2px; }
  .name-input{
    width:100%;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:17px;
    text-align:center;
    padding:11px 14px;
    border-radius:12px;
    border:3px solid #B9CEE6;
    color:var(--navy);
    margin:4px 0 16px;
    outline:none;
  }
  .name-input:focus{ border-color:var(--blue); }
  .search-spinner{
    width:52px; height:52px;
    margin:4px auto 12px;
    border:6px solid #DCE9F8;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin 0.85s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- REWARDS SCREEN ---------- */
  .rewards-card{ padding:18px 22px 20px; max-width:520px; max-height:500px; overflow-y:auto; }
  .rewards-coin-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Fredoka',cursive; font-weight:800; font-size:20px; color:var(--gold-dark);
    margin-bottom:10px;
  }
  .rewards-section-title{
    font-size:13px; font-weight:800; color:var(--navy); text-align:left;
    margin:12px 0 8px; text-transform:uppercase; letter-spacing:.5px;
  }
  .ribbon-grid{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .ribbon-item{
    width:110px;
    border:3px solid #C3D6EC;
    border-radius:14px;
    padding:10px 6px 8px;
    background:#fff;
    cursor:pointer;
  }
  .ribbon-item.selected{ border-color:var(--green-ok); background:#EDFBF1; }
  .ribbon-item.locked{ opacity:.6; cursor:pointer; }
  .ribbon-swatch{
    width:30px; height:34px;
    margin:0 auto 6px;
    clip-path:polygon(50% 0,100% 18%,72% 55%,100% 100%,50% 62%,0 100%,28% 55%,0 18%);
  }
  .ribbon-name{ font-size:12px; font-weight:800; color:var(--navy); }
  .ribbon-cost{ font-size:11px; font-weight:700; color:var(--gold-dark); margin-top:2px; }
  .ribbon-tag{ font-size:11px; font-weight:700; color:var(--green-ok); margin-top:2px; }

  .badge-grid{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .badge-item{
    width:96px;
    border:3px solid #C3D6EC;
    border-radius:14px;
    padding:10px 4px 8px;
    background:#fff;
    text-align:center;
  }
  .badge-item.locked{ opacity:.45; filter:grayscale(1); }
  .badge-icon{ font-size:26px; }
  .badge-name{ font-size:11px; font-weight:800; color:var(--navy); margin-top:3px; line-height:1.2; }

  .rewards-close{
    display:block; margin:16px auto 0;
    font-family:'Fredoka',cursive; font-weight:800; font-size:16px;
    padding:9px 26px; border-radius:99px; border:3px solid var(--navy);
    background:var(--navy); color:#fff; cursor:pointer;
  }

  /* ---------- CHANCE-EXHAUSTED OVERLAY ---------- */
  .chance-btns{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .chance-btn{
    font-family:'Fredoka',cursive; font-weight:800; font-size:16px;
    padding:12px 18px; border-radius:14px; border:none; cursor:pointer; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  .chance-btn:active{ transform:translateY(3px); box-shadow:none; }
  .chance-btn-coins{ background:linear-gradient(180deg,var(--gold),var(--gold-dark)); color:var(--navy); }
  .chance-btn-coins:disabled{ opacity:.45; cursor:not-allowed; }
  .chance-btn-ad{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }

  /* ---------- AD OVERLAY (simulated) ---------- */
  .ad-ring{
    width:64px; height:64px; margin:6px auto 14px;
    border:7px solid #DCE9F8; border-top-color:var(--blue);
    border-radius:50%; animation:spin 1s linear infinite;
  }
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">

  <div class="hud">
    <div class="team-card team-a">
      <div class="team-name" id="teamNameA">Team A</div>
      <div class="team-score">Solved: <span id="solvedA">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullA"></div></div>
    </div>

    <div class="coin-strip">
      <div class="coin-display" id="coinDisplay">🪙 <span id="coinCount">0</span></div>
      <button class="reward-chip-btn" id="rewardsBtn">🎁</button>
    </div>

    <div class="timer-pod">
      <div class="timer-time" id="timeText">00:10</div>
      <div class="timer-label">Time left</div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <div class="mini-btn-row">
        <button class="restart-mini" id="modeBtn">🔀 Mode</button>
        <button class="restart-mini" id="muteBtn">🔊</button>
      </div>
    </div>

    <div class="team-card team-b">
      <div class="team-name" id="teamNameB">Team B</div>
      <div class="team-score">Solved: <span id="solvedB">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullB"></div></div>
    </div>
  </div>

  <div class="arena">
    <div class="q-card q-a">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qA">8 + 7 = ?</div>
    </div>
    <div class="q-card q-b">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qB">6 × 3 = ?</div>
    </div>

    <div class="rope-zone">
      <div class="rope"></div>
      <div class="ribbon" id="ribbon" style="left:50%"></div>
    </div>
  </div>

  <div class="controls">
    <div class="pad-box pad-a" id="padBoxA">
      <div class="pad-head">
        <div class="pad-title" id="padTitleA">Team A</div>
        <div class="answer-box" id="ansA"></div>
      </div>
      <div class="keypad" id="padA"></div>
    </div>

    <div class="pad-box pad-b" id="padBoxB">
      <div class="pad-head">
        <div class="pad-title" id="padTitleB">Team B</div>
        <div class="answer-box" id="ansB"></div>
      </div>
