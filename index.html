<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Brain Exercise — Math Tug of War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FFDE9C;
    --sky-bottom:#FFB84C;
    --ground:#7A9B57;
    --ground-dark:#5E7A42;
    --team-a:#E8543E;
    --team-a-dark:#B93A28;
    --team-b:#1F8A82;
    --team-b-dark:#0F6961;
    --rope:#8B5E34;
    --ink:#2B241B;
    --cream:#FFF6E6;
    --flag:#F4C542;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:'Mukta','Baloo 2',sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 55%, var(--ground) 55%, var(--ground-dark) 100%);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,.headline{font-family:'Baloo 2',sans-serif;}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:14px 12px 28px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .title{
    font-size:clamp(20px,5.5vw,28px);
    font-weight:800;
    color:var(--ink);
    text-shadow:0 2px 0 rgba(255,255,255,.35);
  }
  .round-badge{
    background:var(--cream);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:5px 14px;
    font-weight:700;
    font-size:14px;
    box-shadow:2px 2px 0 rgba(0,0,0,.15);
  }

  /* ARENA */
  .arena{
    position:relative;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:18px 10px 26px;
    box-shadow:4px 5px 0 rgba(0,0,0,.18);
    margin-bottom:14px;
    overflow:hidden;
  }
  .track{
    position:relative;
    height:110px;
    margin:6px 0 16px;
  }
  .rope-line{
    position:absolute;
    top:50%;
    left:6%;
    right:6%;
    height:10px;
    background:repeating-linear-gradient(90deg, var(--rope) 0 14px, #6E4726 14px 16px);
    transform:translateY(-50%);
    border-radius:6px;
    box-shadow:0 3px 0 rgba(0,0,0,.25) inset;
  }
  .pit{
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:70px;
    background:repeating-linear-gradient(180deg, transparent 0 4px, rgba(0,0,0,.18) 4px 8px);
    transform:translate(-50%,-50%);
  }
  .knot{
    position:absolute;
    top:50%;
    width:26px;height:26px;
    background:var(--flag);
    border:3px solid var(--ink);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.34,1.56,.64,1);
    box-shadow:2px 2px 0 rgba(0,0,0,.25);
    z-index:3;
  }
  .zone-marker{
    position:absolute;
    top:50%;
    width:3px;height:34px;
    background:var(--ink);
    opacity:.35;
    transform:translate(-50%,-50%);
  }
  .fighter{
    position:absolute;
    top:50%;
    font-size:44px;
    transform:translate(-50%,-56%);
    transition:left .55s cubic-bezier(.34,1.56,.64,1), transform .3s;
    z-index:2;
  }
  .fighter.lean{ transform:translate(-50%,-56%) rotate(var(--tilt,0deg)); }
  .fighter-a{ filter:none; }
  .fighter-b{ transform:translate(-50%,-56%) scaleX(-1); }
  .fighter-b.lean{ transform:translate(-50%,-56%) scaleX(-1) rotate(var(--tilt,0deg)); }

  .scorebar{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .meter{
    flex:1;
    height:16px;
    background:#EADFC5;
    border:2px solid var(--ink);
    border-radius:999px;
    position:relative;
    overflow:hidden;
  }
  .meter-fill{
    position:absolute;
    top:0;bottom:0;
    left:50%;
    background:linear-gradient(90deg,var(--team-a),var(--team-b));
    transition:width .5s ease, left .5s ease;
  }
  .meter-mid{
    position:absolute;
    left:50%;top:-3px;bottom:-3px;
    width:2px;
    background:var(--ink);
    transform:translateX(-50%);
  }

  /* PLAYER PANELS */
  .panels{
    display:flex;
    gap:10px;
  }
  .panel{
    flex:1;
    border-radius:16px;
    border:3px solid var(--ink);
    padding:10px 8px 12px;
    text-align:center;
    position:relative;
    transition:transform .15s, box-shadow .15s;
  }
  .panel-a{ background:#FCE2DB; box-shadow:3px 4px 0 var(--team-a-dark); }
  .panel-b{ background:#DCF0EC; box-shadow:3px 4px 0 var(--team-b-dark); }
  .panel.win-flash{ animation:flashwin .55s ease; }
  @keyframes flashwin{
    0%{transform:scale(1);}
    30%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }
  .panel-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(15px,4vw,18px);
    margin-bottom:2px;
  }
  .panel-a .panel-name{ color:var(--team-a-dark); }
  .panel-b .panel-name{ color:var(--team-b-dark); }

  .question{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:clamp(20px,6vw,26px);
    background:var(--cream);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:6px 4px;
    margin:6px 0 8px;
    min-height:38px;
    display:flex;align-items:center;justify-content:center;
  }
  .answer-display{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:20px;
    background:#fff;
    border:2px dashed var(--ink);
    border-radius:8px;
    min-height:34px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:8px;
    letter-spacing:1px;
  }
  .answer-display.shake{ animation:shake .35s; border-color:#C0392B; color:#C0392B; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  .key{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:9px 0;
    border-radius:8px;
    border:2px solid var(--ink);
    background:#fff;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
  }
  .key:active{ transform:translateY(2px); }
  .panel-a .key{ box-shadow:2px 2px 0 var(--team-a-dark); }
  .panel-b .key{ box-shadow:2px 2px 0 var(--team-b-dark); }
  .key.wide{ grid-column:span 3; }
  .key.submit{ background:var(--flag); }
  .key.clear{ background:#EEE; font-size:13px; }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:8px;
  }
  .timer-wrap{
    flex:1;
    height:10px;
    background:#EADFC5;
    border:2px solid var(--ink);
    border-radius:999px;
    overflow:hidden;
  }
  .timer-fill{
    height:100%;
    background:var(--flag);
    width:100%;
    transition:width .1s linear;
  }
  .restart-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--cream);
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(0,0,0,.2);
  }

  /* WIN OVERLAY */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,15,10,.55);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .win-card{
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:20px;
    padding:28px 24px;
    text-align:center;
    max-width:320px;
    box-shadow:6px 6px 0 rgba(0,0,0,.3);
  }
  .win-card .emoji{ font-size:52px; }
  .win-card h2{
    font-size:26px;
    margin:8px 0 4px;
  }
  .win-card p{ margin:0 0 16px; font-size:14px; opacity:.8; }
  .play-again{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:16px;
    padding:10px 22px;
    border-radius:999px;
    border:3px solid var(--ink);
    background:var(--flag);
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.25);
  }

  .instructions{
    text-align:center;
    font-size:12.5px;
    opacity:.75;
    margin:6px 0 0;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="title">🧠 Brain Exercise</div>
    <div class="round-badge" id="roundBadge">Round 1</div>
  </div>

  <div class="arena">
    <div class="track" id="track">
      <div class="rope-line"></div>
      <div class="pit"></div>
      <div class="zone-marker" style="left:14%"></div>
      <div class="zone-marker" style="left:86%"></div>
      <div class="fighter fighter-a" id="fighterA" style="left:14%">🧑‍🦱</div>
      <div class="fighter fighter-b" id="fighterB" style="left:86%">🧑‍🦰</div>
      <div class="knot" id="knot" style="left:50%"></div>
    </div>
    <div class="scorebar">
      <div class="meter"><div class="meter-mid"></div><div class="meter-fill" id="meterFill"></div></div>
    </div>
  </div>

  <div class="panels">
    <div class="panel panel-a" id="panelA">
      <div class="panel-name">Team A</div>
      <div class="question" id="qA">--</div>
      <div class="answer-display" id="ansA"></div>
      <div class="keypad" id="padA"></div>
    </div>
    <div class="panel panel-b" id="panelB">
      <div class="panel-name">Team B</div>
      <div class="question" id="qB">--</div>
      <div class="answer-display" id="ansB"></div>
      <div class="keypad" id="padB"></div>
    </div>
  </div>

  <div class="footer-row">
    <div class="timer-wrap"><div class="timer-fill" id="timerFill"></div></div>
    <button class="restart-btn" id="restartBtn">🔄 Restart</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <div class="emoji" id="winEmoji">🏆</div>
    <h2 id="winTitle">Team A Wins!</h2>
    <p>Pulled the rope all the way to their side</p>
    <button class="play-again" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
  // ---- Telegram Mini App setup ----
  if(window.Telegram && window.Telegram.WebApp){
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();                     // open full height instead of half-sheet
    try{ tg.disableVerticalSwipes(); }catch(e){}   // stop accidental swipe-to-close while playing
    try{ tg.setHeaderColor('#FFB84C'); }catch(e){} // match the game's sky color
    try{ tg.setBackgroundColor('#FFDE9C'); }catch(e){}
  }

  const LIMIT = 5;          // rope must reach -5 or +5 to win
  const ROUND_TIME = 10000; // ms per round

  let position = 0;         // -5..5, negative = A side, positive = B side
  let round = 1;
  let roundActive = true;
  let qA, qB;
  let answerA = '', answerB = '';
  let timerStart, timerRAF;
  let gameOver = false;

  const knot = document.getElementById('knot');
  const fighterA = document.getElementById('fighterA');
  const fighterB = document.getElementById('fighterB');
  const meterFill = document.getElementById('meterFill');
  const roundBadge = document.getElementById('roundBadge');
  const qAEl = document.getElementById('qA');
  const qBEl = document.getElementById('qB');
  const ansAEl = document.getElementById('ansA');
  const ansBEl = document.getElementById('ansB');
  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');
  const timerFill = document.getElementById('timerFill');
  const overlay = document.getElementById('overlay');
  const winTitle = document.getElementById('winTitle');
  const winEmoji = document.getElementById('winEmoji');

  function posToPercent(p){
    return 50 + p * 7.2;
  }

  function updateVisual(){
    const pct = posToPercent(position);
    knot.style.left = pct + '%';
    fighterA.style.left = '14%';
    fighterB.style.left = '86%';
    const fillPct = Math.abs(position) / LIMIT * 50;
    if(position <= 0){
      meterFill.style.left = (50 - fillPct) + '%';
      meterFill.style.width = fillPct + '%';
    } else {
      meterFill.style.left = '50%';
      meterFill.style.width = fillPct + '%';
    }
  }

  function leanFighter(el, deg){
    el.classList.add('lean');
    el.style.setProperty('--tilt', deg + 'deg');
    setTimeout(()=>{ el.classList.remove('lean'); el.style.setProperty('--tilt','0deg'); }, 400);
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function makeQuestion(){
    const ops = ['+','-','×','÷'];
    const op = ops[randInt(0,3)];
    let a,b,answer,text;
    if(op === '+'){
      a = randInt(2,30); b = randInt(2,30);
      answer = a+b; text = a+' + '+b;
    } else if(op === '-'){
      a = randInt(5,40); b = randInt(1,a);
      answer = a-b; text = a+' − '+b;
    } else if(op === '×'){
      a = randInt(2,12); b = randInt(2,10);
      answer = a*b; text = a+' × '+b;
    } else {
      b = randInt(2,10); answer = randInt(2,12); a = b*answer;
      text = a+' ÷ '+b;
    }
    return {text, answer: String(answer)};
  }

  function newRound(){
    if(gameOver) return;
    roundActive = true;
    answerA = ''; answerB = '';
    qA = makeQuestion();
    qB = makeQuestion();
    qAEl.textContent = qA.text + ' = ?';
    qBEl.textContent = qB.text + ' = ?';
    ansAEl.textContent = '';
    ansBEl.textContent = '';
    roundBadge.textContent = 'Round ' + round;
    startTimer();
  }

  function startTimer(){
    cancelAnimationFrame(timerRAF);
    timerStart = performance.now();
    function tick(now){
      if(!roundActive) return;
      const elapsed = now - timerStart;
      const pct = Math.max(0, 100 - (elapsed/ROUND_TIME)*100);
      timerFill.style.width = pct + '%';
      if(elapsed >= ROUND_TIME){
        round++;
        newRound();
        return;
      }
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function submitAnswer(side){
    if(!roundActive || gameOver) return;
    const val = side === 'A' ? answerA : answerB;
    const q = side === 'A' ? qA : qB;
    const ansEl = side === 'A' ? ansAEl : ansBEl;
    if(val === '') return;
    if(val === q.answer){
      roundActive = false;
      cancelAnimationFrame(timerRAF);
      const panel = side === 'A' ? panelA : panelB;
      panel.classList.add('win-flash');
      setTimeout(()=>panel.classList.remove('win-flash'), 550);
      if(side === 'A'){
        position = Math.max(-LIMIT, position - 1);
        leanFighter(fighterA, -18);
        leanFighter(fighterB, 10);
      } else {
        position = Math.min(LIMIT, position + 1);
        leanFighter(fighterB, 18);
        leanFighter(fighterA, -10);
      }
      updateVisual();
      round++;
      setTimeout(()=>{
        if(Math.abs(position) >= LIMIT){
          endGame(position < 0 ? 'A' : 'B');
        } else {
          newRound();
        }
      }, 650);
    } else {
      ansEl.textContent = val + ' ✗';
      ansEl.classList.add('shake');
      setTimeout(()=>{
        ansEl.classList.remove('shake');
        if(side==='A'){ answerA=''; ansAEl.textContent=''; }
        else { answerB=''; ansBEl.textContent=''; }
      }, 350);
    }
  }

  function handleKey(side, key){
    if(!roundActive || gameOver) return;
    if(side==='A'){
      if(key==='clear') answerA='';
      else if(key==='del') answerA = answerA.slice(0,-1);
      else if(key==='ok') { submitAnswer('A'); return; }
      else if(answerA.length < 4) answerA += key;
      ansAEl.textContent = answerA;
    } else {
      if(key==='clear') answerB='';
      else if(key==='del') answerB = answerB.slice(0,-1);
      else if(key==='ok') { submitAnswer('B'); return; }
      else if(answerB.length < 4) answerB += key;
      ansBEl.textContent = answerB;
    }
  }

  function buildPad(container, side){
    const keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
    container.innerHTML = '';
    keys.forEach(k=>{
      const btn = document.createElement('div');
      btn.className = 'key';
      if(k==='del'){ btn.classList.add('clear'); btn.textContent='⌫'; }
      else if(k==='ok'){ btn.classList.add('submit'); btn.textContent='✓'; }
      else btn.textContent = k;
      btn.addEventListener('click', ()=>handleKey(side, k));
      container.appendChild(btn);
    });
  }

  function endGame(winner){
    gameOver = true;
    roundActive = false;
    cancelAnimationFrame(timerRAF);
    winTitle.textContent = winner === 'A' ? 'Team A Wins! 🎉' : 'Team B Wins! 🎉';
    winEmoji.textContent = winner === 'A' ? '🟥🏆' : '🟦🏆';
    overlay.classList.add('show');
  }

  function resetGame(){
    position = 0; round = 1; gameOver = false;
    updateVisual();
    overlay.classList.remove('show');
    newRound();
  }

  buildPad(document.getElementById('padA'), 'A');
  buildPad(document.getElementById('padB'), 'B');
  document.getElementById('restartBtn').addEventListener('click', resetGame);
  document.getElementById('playAgainBtn').addEventListener('click', resetGame);

  updateVisual();
  newRound();
})();
</script>

</body>
</html>
