<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brain Exercise — Math Tug of War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1F62C9;
    --blue-soft:#3E84E6;
    --red:#D93B3B;
    --navy:#12386B;
    --navy-deep:#0C2748;
    --sky-1:#8FC7F0;
    --sky-2:#C8E6F8;
    --sand:#D9B98A;
    --sand-dark:#BE9968;
    --grass:#6FB23F;
    --grass-dark:#4F8C2B;
    --gold:#F5C542;
    --gold-dark:#D19A16;
    --green-ok:#3BA55D;
    --ink:#0F2440;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--navy-deep);
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--ink);
  }

  /* The game lives on ONE fixed canvas (900 x 560).
     JS scales that whole canvas to fit the screen it opens on,
     so phone / tablet / laptop all see identical proportions. */
  .viewport{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    position:relative;
    width:900px;
    height:560px;
    flex:0 0 auto;
    transform-origin:center center;
    display:flex;
    flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(180deg,
      var(--sky-1) 0%, var(--sky-2) 33%,
      var(--sand) 33%, var(--sand-dark) 63%,
      var(--grass) 63%, var(--grass-dark) 100%);
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }

  /* ---------- TOP HUD ---------- */
  .hud{
    flex:0 0 96px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 14px 0;
  }
  .team-card{
    flex:1 1 0;
    min-width:0;
    border-radius:16px;
    padding:9px 16px 10px;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .team-a{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }
  .team-b{ background:linear-gradient(180deg,#E85C5C,var(--red)); text-align:right; }
  .team-name{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:21px;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .team-score{
    font-size:14px;
    font-weight:700;
    opacity:.95;
    line-height:1.3;
  }
  .pull-bar{
    height:9px;
    border-radius:99px;
    background:rgba(0,0,0,.3);
    overflow:hidden;
    margin-top:5px;
  }
  .pull-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    transition:width .45s ease;
  }
  .team-a .pull-fill{ background:linear-gradient(90deg,#8FE86B,#4FCB2F); }
  .team-b .pull-fill{ background:linear-gradient(90deg,#FF8B6B,#FF5A3C); margin-left:auto; }

  .timer-pod{
    flex:0 0 150px;
    background:linear-gradient(180deg,#2C5A9E,var(--navy));
    border-radius:16px;
    padding:7px 14px 8px;
    text-align:center;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .timer-time{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:26px;
    line-height:1;
  }
  .timer-label{ font-size:11px; opacity:.85; font-weight:700; margin-top:1px; }
  .timer-track{
    height:5px;
    border-radius:99px;
    background:rgba(0,0,0,.35);
    margin-top:5px;
    overflow:hidden;
  }
  .timer-fill{
    height:100%;
    width:100%;
    background:var(--gold);
    transition:width .1s linear;
  }
  .mini-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    row-gap:4px;
    justify-content:center;
    margin-top:6px;
  }
  .restart-mini{
    display:block;
    margin:0;
    font-family:'Quicksand',sans-serif;
    font-size:11px;
    font-weight:800;
    padding:3px 12px;
    border-radius:99px;
    border:2px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.14);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  .restart-mini:active{ transform:translateY(1px); }
  #muteBtn{ padding:3px 10px; }
  #muteBtn.muted{ opacity:.55; }

  /* ---------- ARENA ---------- */
  .arena{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }

  .q-card{
    position:absolute;
    top:0px;
    background:#fff;
    border:4px solid var(--blue);
    border-radius:16px;
    padding:6px 22px 9px;
    text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.2);
    min-width:180px;
    z-index:5;
  }
  .q-card.q-b{ border-color:var(--red); }
  .q-label{ font-size:12px; font-weight:700; color:#5A7391; line-height:1.2; }
  .q-text{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:30px;
    line-height:1.15;
    color:var(--navy);
    white-space:nowrap;
  }
  .q-a{ left:150px; }
  .q-b{ right:150px; }

  .rope-zone{
    position:absolute;
    left:0; right:0;
    bottom:34px;
    height:0;
  }
  .rope{
    position:absolute;
    left:60px; right:60px;
    top:0;
    height:11px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(72deg,#C79A5E 0 6px,#A87A42 6px 12px);
    border-radius:99px;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.28);
  }
  .ribbon{
    position:absolute;
    top:0;
    width:26px; height:30px;
    transform:translate(-50%,-52%);
    transition:left .5s cubic-bezier(.34,1.4,.64,1);
    z-index:4;
    background:var(--red);
    clip-path:polygon(50% 0,100% 18%,72% 55%,100% 100%,50% 62%,0 100%,28% 55%,0 18%);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
  }

  /* ---------- CONTROLS (bigger now that character space is freed up) ---------- */
  .controls{
    flex:0 0 270px;
    display:flex;
    gap:16px;
    padding:8px 16px 14px;
    background:linear-gradient(180deg,rgba(12,39,72,0) 0%, var(--navy-deep) 16%);
  }
  .pad-box{
    flex:1 1 0;
    min-width:0;
    background:linear-gradient(180deg,#F4F8FE,#DCE8F7);
    border:4px solid var(--blue);
    border-radius:18px;
    padding:8px 10px 10px;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
  }
  .pad-b{ border-color:var(--red); }
  .pad-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:7px;
  }
  .pad-b .pad-head{ flex-direction:row-reverse; }
  .pad-title{
    font-size:14px;
    font-weight:800;
    color:var(--navy);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:120px;
  }
  .pad-stage{ position:relative; }
  .ai-think{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
    background:rgba(255,255,255,.95);
    border-radius:14px;
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:14px;
    color:var(--navy);
    z-index:3;
    padding:6px;
  }
  .ai-think.show{ display:flex; }
  .ai-think .dots::after{
    content:'.';
    animation:dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'.';} 33%{content:'..';} 66%{content:'...';} 100%{content:'.';}
  }
  .answer-box{
    flex:1 1 auto;
    min-width:0;
    background:#fff;
    border:3px solid #B9CEE6;
    border-radius:12px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    letter-spacing:1px;
  }
  .answer-box.ok{ border-color:var(--green-ok); color:var(--green-ok); background:#EDFBF1; }
  .answer-box.bad{ border-color:var(--red); color:var(--red); background:#FDEDED; animation:shake .3s; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    30%{transform:translateX(-7px);}
    70%{transform:translateX(7px);}
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    background:#fff;
    border:3px solid #C3D6EC;
    border-radius:13px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    box-shadow:0 3px 0 #B0C6DF;
  }
  .key:active{ transform:translateY(3px); box-shadow:none; }
  .key.back{ background:var(--navy); color:#fff; border-color:#071A31; box-shadow:0 3px 0 #071A31; font-size:22px; }
  .key.go{ background:var(--green-ok); color:#fff; border-color:#2C8247; box-shadow:0 3px 0 #24693A; font-size:22px; }

  .pad-box.flash{ animation:pop .5s ease; }
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.03);}
    100%{transform:scale(1);}
  }

  /* ---------- WIN OVERLAY ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(8,24,45,.74);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
  }
  .overlay.show{ display:flex; }
  .win-card{
    background:linear-gradient(180deg,#F7FBFF,#DCE9F8);
    border:5px solid var(--gold);
    border-radius:22px;
    padding:24px 40px 26px;
    text-align:center;
    max-width:440px;
    box-shadow:0 10px 0 rgba(0,0,0,.35);
  }
  .win-trophy{ font-size:58px; line-height:1; }
  .win-card h2{
    font-family:'Fredoka',cursive;
    font-size:30px;
    margin:8px 0 4px;
    color:var(--navy);
  }
  .win-card p{ margin:0 0 16px; font-size:15px; color:#4C6A8C; font-weight:600; }
  .play-again{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:19px;
    padding:11px 32px;
    border-radius:99px;
    border:4px solid var(--gold-dark);
    background:var(--gold);
    color:var(--navy);
    cursor:pointer;
    box-shadow:0 5px 0 var(--gold-dark);
  }
  .play-again:active{ transform:translateY(4px); box-shadow:none; }
  .share-btn{
    display:block;
    margin:12px auto 0;
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:15px;
    padding:9px 22px;
    border-radius:99px;
    border:3px solid var(--navy);
    background:linear-gradient(180deg,var(--blue-soft),var(--blue));
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 var(--navy);
  }
  .share-btn:active{ transform:translateY(3px); box-shadow:none; }

  /* ---------- MODE / NAME OVERLAYS ---------- */
  .mode-card{ padding:22px 34px 26px; }
  .mode-btns{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:6px;
  }
  .mode-btn{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:18px;
    padding:13px 20px;
    border-radius:16px;
    border:none;
    cursor:pointer;
    color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
  }
  .mode-btn:active{ transform:translateY(4px); box-shadow:none; }
  .mode-btn-a{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }
  .mode-btn-b{ background:linear-gradient(180deg,#E85C5C,var(--red)); }
  .mode-sub{ font-size:12px; opacity:.85; font-weight:600; margin-top:2px; }
  .name-input{
    width:100%;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:17px;
    text-align:center;
    padding:11px 14px;
    border-radius:12px;
    border:3px solid #B9CEE6;
    color:var(--navy);
    margin:4px 0 16px;
    outline:none;
  }
  .name-input:focus{ border-color:var(--blue); }
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">

  <div class="hud">
    <div class="team-card team-a">
      <div class="team-name" id="teamNameA">Team A</div>
      <div class="team-score">Solved: <span id="solvedA">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullA"></div></div>
    </div>

    <div class="timer-pod">
      <div class="timer-time" id="timeText">00:10</div>
      <div class="timer-label">Time left</div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <div class="mini-btn-row">
        <button class="restart-mini" id="modeBtn">🔀 Mode</button>
        <button class="restart-mini" id="muteBtn">🔊</button>
      </div>
    </div>

    <div class="team-card team-b">
      <div class="team-name" id="teamNameB">Team B</div>
      <div class="team-score">Solved: <span id="solvedB">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullB"></div></div>
    </div>
  </div>

  <div class="arena">
    <div class="q-card q-a">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qA">8 + 7 = ?</div>
    </div>
    <div class="q-card q-b">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qB">6 × 3 = ?</div>
    </div>

    <div class="rope-zone">
      <div class="rope"></div>
      <div class="ribbon" id="ribbon" style="left:50%"></div>
    </div>
  </div>

  <div class="controls">
    <div class="pad-box pad-a" id="padBoxA">
      <div class="pad-head">
        <div class="pad-title" id="padTitleA">Team A</div>
        <div class="answer-box" id="ansA"></div>
      </div>
      <div class="keypad" id="padA"></div>
    </div>

    <div class="pad-box pad-b" id="padBoxB">
      <div class="pad-head">
        <div class="pad-title" id="padTitleB">Team B</div>
        <div class="answer-box" id="ansB"></div>
      </div>
      <div class="pad-stage">
        <div class="keypad" id="padB"></div>
        <div class="ai-think" id="aiThink">🤔 <span>Thinking<span class="dots"></span></span></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="win-trophy">🏆</div>
      <h2 id="winTitle">Team A wins!</h2>
      <p id="winSub">Pulled the ribbon all the way over.</p>
      <button class="play-again" id="playAgainBtn">Play again</button>
      <button class="share-btn" id="shareBtn">Share &amp; Challenge a Friend</button>
    </div>
  </div>

  <div class="overlay show" id="modeOverlay">
    <div class="win-card mode-card">
      <div class="win-trophy">🎮</div>
      <h2>How do you want to play?</h2>
      <p>Choose your mode</p>
      <div class="mode-btns">
        <button class="mode-btn mode-btn-a" id="btnFriend">Play with Friend</button>
        <button class="mode-btn mode-btn-b" id="btnOnline">Play Online</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="nameOverlay">
    <div class="win-card mode-card">
      <div class="win-trophy">🧑</div>
      <h2>What's your name?</h2>
      <p class="mode-sub">This name will appear instead of Team A</p>
      <input type="text" id="nameInput" class="name-input" placeholder="Enter your name" maxlength="14">
      <button class="play-again" id="btnStartOnline">Start</button>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  // ---- play counter ----
  (function trackPlay(){
    try{
      const key = location.origin + location.pathname;
      fetch('https://hits-app.vercel.app/hits?url=' + encodeURIComponent(key) + '&json').catch(()=>{});
    }catch(e){}
  })();

  // ---- Telegram Mini App setup ----
  if(window.Telegram && window.Telegram.WebApp){
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try{ tg.disableVerticalSwipes(); }catch(e){}
    try{ tg.setHeaderColor('#0C2748'); }catch(e){}
    try{ tg.setBackgroundColor('#0C2748'); }catch(e){}
    try{ tg.requestFullscreen(); }catch(e){}
  }

  // ---- FIT THE FIXED CANVAS TO ANY SCREEN ----
  // The design size never changes, so nothing can overlap and nothing
  // balloons on a big screen. Only the zoom level changes per device.
  const DESIGN_W = 900, DESIGN_H = 560;
  const MAX_SCALE = 1.3;   // keeps the keypad from getting huge on laptops
  const stage = document.getElementById('stage');

  function fitStage(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // A tall screen (phone held upright) gets the canvas turned sideways,
    // so the player just rotates the phone and everything already fits.
    const rotate = vh > vw;
    const availW = rotate ? vh : vw;
    const availH = rotate ? vw : vh;
    let scale = Math.min(availW / DESIGN_W, availH / DESIGN_H) * 0.98;
    scale = Math.min(scale, MAX_SCALE);
    stage.style.transform = (rotate ? 'rotate(90deg) ' : '') + 'scale(' + scale + ')';
  }
  fitStage();
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 200); });

  // ---- sound effects (synth, no audio files needed) ----
  const SFX = (function(){
    let ctx;
    let enabled = true;
    function ac(){
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, opts){
      if(!enabled) return;
      opts = opts || {};
      try{
        const c = ac();
        const t0 = c.currentTime + (opts.delay || 0);
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = opts.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + dur);
        const vol = opts.vol != null ? opts.vol : 0.18;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain).connect(c.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }catch(e){}
    }
    return {
      unlock: function(){ try{ ac(); }catch(e){} },
      isEnabled: function(){ return enabled; },
      setEnabled: function(v){ enabled = v; },
      key: function(){ tone(520, 0.06, {type:'square', vol:0.08}); },
      correct: function(){
        tone(660, 0.09, {type:'triangle', vol:0.16});
        tone(880, 0.12, {type:'triangle', vol:0.16, delay:0.09});
      },
      wrong: function(){ tone(160, 0.18, {type:'sawtooth', vol:0.12, slideTo:90}); },
      tick: function(){ tone(1000, 0.05, {type:'square', vol:0.06}); },
      win: function(){
        [523,659,784,1047].forEach(function(f,i){
          tone(f, 0.22, {type:'triangle', vol:0.18, delay:i*0.13});
        });
      }
    };
  })();
  // unlock audio on first touch/click (required by mobile browsers)
  ['touchstart','click'].forEach(function(ev){
    window.addEventListener(ev, function once(){ SFX.unlock(); window.removeEventListener(ev, once); }, {once:true});
  });

  // ---- game state ----
  const LIMIT = 5;
  const ROUND_TIME = 10000;
  const INDIAN_NAMES = ['Rahul','Amit','Rohan','Vikram','Suresh','Ankit','Arjun','Karan','Manoj','Deepak',
    'Sanjay','Nikhil','Priya','Neha','Pooja','Kavita','Sneha','Anjali','Ritu','Simran'];

  let mode = null;          // 'friend' or 'online'
  let playerName = 'You';
  let opponentName = 'Rahul';
  let aiTimeout = null;

  // adaptive difficulty state (Play Online): AI speed reacts to how the user is doing
  let wrongStreakA = 0;          // consecutive wrong tries by the user in THIS round
  let aiHandicappedThisRound = false;
  let helpUserNextRound = false; // if true, next round: easier for user, harder for AI
  let userTimeSamples = [];      // recent correct-answer times for the user (ms)
  let roundStartTime = 0;
  let userGamesPlayed = 0;       // games started in Play Online, this session
  let pityActive = false;        // when true, the AI can't quite land the finishing pull
  let userCorrectCount = 0;      // this match: user's correct answers
  let userWrongCount = 0;        // this match: user's wrong tries
  let totalSolved = 0;           // this match: questions solved by BOTH sides combined — drives progression
  let userRoundStreak = 0;       // consecutive ROUNDS the user has solved first
  let userMissStreak = 0;        // consecutive ROUNDS the user has failed to solve
  let hardBurstRounds = 0;       // remaining rounds where the user's own question is deliberately hard

  let position = 0;
  let roundActive = true;
  let gameOver = true;
  let qA, qB;
  let answerA = '', answerB = '';
  let solvedA = 0, solvedB = 0;
  let timerStart, timerRAF;

  const ribbon    = document.getElementById('ribbon');
  const qAEl      = document.getElementById('qA');
  const qBEl      = document.getElementById('qB');
  const ansAEl    = document.getElementById('ansA');
  const ansBEl    = document.getElementById('ansB');
  const padBoxA   = document.getElementById('padBoxA');
  const padBoxB   = document.getElementById('padBoxB');
  const pullA     = document.getElementById('pullA');
  const pullB     = document.getElementById('pullB');
  const solvedAEl = document.getElementById('solvedA');
  const solvedBEl = document.getElementById('solvedB');
  const timerFill = document.getElementById('timerFill');
  const timeText  = document.getElementById('timeText');
  const overlay   = document.getElementById('overlay');
  const winTitle  = document.getElementById('winTitle');
  const winSub    = document.getElementById('winSub');
  const modeOverlay = document.getElementById('modeOverlay');
  const nameOverlay = document.getElementById('nameOverlay');
  const nameInput   = document.getElementById('nameInput');
  const teamNameAEl = document.getElementById('teamNameA');
  const teamNameBEl = document.getElementById('teamNameB');
  const padTitleAEl = document.getElementById('padTitleA');
  const padTitleBEl = document.getElementById('padTitleB');
  const aiThinkEl   = document.getElementById('aiThink');

  function showThinking(v){
    aiThinkEl.classList.toggle('show', !!v);
  }

  function updateVisual(){
    ribbon.style.left = (50 + position * 7.2) + '%';
    pullA.style.width = (Math.max(0, -position) / LIMIT * 100) + '%';
    pullB.style.width = (Math.max(0,  position) / LIMIT * 100) + '%';
    solvedAEl.textContent = solvedA;
    solvedBEl.textContent = solvedB;
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function makeQuestion(level, tier){
    level = level || 'normal';
    tier = tier || 0;   // 0 = normal, 1 = harder (20+ solved), 2 = advanced ops unlocked (30+ solved)
    const boost = tier >= 2 ? 1.8 : (tier >= 1 ? 1.35 : 1);

    // Once the match has gone on a while, mix in square / cube / square-root questions
    if(tier >= 2 && level !== 'easy' && Math.random() < 0.35) return makeAdvancedQuestion(level);

    let op;
    if(level === 'easy') op = Math.random() < 0.7 ? '+' : '-';
    else if(level === 'hard') op = Math.random() < 0.6 ? (Math.random() < 0.5 ? '×' : '÷') : (Math.random() < 0.5 ? '+' : '-');
    else op = ['+','-','×','÷'][randInt(0,3)];

    let a,b,answer,text;
    if(op === '+'){
      if(level === 'easy'){ a = randInt(2, Math.round(12*boost)); b = randInt(2, Math.round(12*boost)); }
      else if(level === 'hard'){ a = randInt(15, Math.round(60*boost)); b = randInt(15, Math.round(60*boost)); }
      else { a = randInt(2, Math.round(30*boost)); b = randInt(2, Math.round(30*boost)); }
      answer = a+b; text = a+' + '+b;
    } else if(op === '-'){
      if(level === 'easy'){ a = randInt(5, Math.round(15*boost)); b = randInt(1,a); }
      else if(level === 'hard'){ a = randInt(30, Math.round(70*boost)); b = randInt(1,a); }
      else { a = randInt(5, Math.round(40*boost)); b = randInt(1,a); }
      answer = a-b; text = a+' − '+b;
    } else if(op === '×'){
      if(level === 'easy'){ a = randInt(2, Math.round(6*boost)); b = randInt(2, Math.round(5*boost)); }
      else if(level === 'hard'){ a = randInt(6, Math.round(15*boost)); b = randInt(6, Math.round(12*boost)); }
      else { a = randInt(2, Math.round(12*boost)); b = randInt(2, Math.round(10*boost)); }
      answer = a*b; text = a+' × '+b;
    } else {
      if(level === 'easy'){ b = randInt(2, Math.round(5*boost)); answer = randInt(2, Math.round(6*boost)); a = b*answer; }
      else if(level === 'hard'){ b = randInt(6, Math.round(12*boost)); answer = randInt(6, Math.round(14*boost)); a = b*answer; }
      else { b = randInt(2, Math.round(10*boost)); answer = randInt(2, Math.round(12*boost)); a = b*answer; }
      text = a+' ÷ '+b;
    }
    return {text:text, answer:String(answer), op:op, a:a, b:b};
  }

  function makeAdvancedQuestion(level){
    const type = ['square','cube','sqrt'][randInt(0,2)];
    const big = level === 'hard';
    let a, answer, text, op;
    if(type === 'square'){
      a = big ? randInt(11,20) : randInt(2,15); answer = a*a; text = a+'²'; op = 'sq';
    } else if(type === 'cube'){
      a = big ? randInt(6,10) : randInt(2,8); answer = a*a*a; text = a+'³'; op = 'cube';
    } else {
      a = big ? randInt(11,18) : randInt(2,15); answer = a; text = '√'+(a*a); op = 'sqrt';
    }
    return {text:text, answer:String(answer), op:op, a:a, b:0};
  }

  // Progression: as the match goes on, questions gradually get harder for BOTH
  // players, in both Play with Friend and Play Online — then advanced ops unlock.
  function currentTier(){
    if(totalSolved >= 30) return 2;   // square / cube / square-root start appearing
    if(totalSolved >= 20) return 1;   // bigger numbers on the standard ops
    return 0;
  }

  function newRound(){
    if(gameOver) return;
    roundActive = true;
    answerA = ''; answerB = '';
    wrongStreakA = 0;
    aiHandicappedThisRound = false;
    roundStartTime = performance.now();

    let levelA = 'normal', levelB = 'normal';
    if(mode === 'online' && helpUserNextRound){
      levelA = 'easy';   // user was struggling last round — give them a breather
      levelB = 'hard';   // AI genuinely gets a harder sum, which naturally slows it down
      helpUserNextRound = false;
    } else if(mode === 'online' && hardBurstRounds > 0){
      levelA = 'hard';   // early hot streak — challenge the user for a couple of rounds
      hardBurstRounds--;
    }
    const tier = currentTier();
    qA = makeQuestion(levelA, tier);
    qB = makeQuestion(levelB, tier);
    qAEl.textContent = qA.text + ' = ?';
    qBEl.textContent = qB.text + ' = ?';
    ansAEl.textContent = ''; ansAEl.className = 'answer-box';
    ansBEl.textContent = ''; ansBEl.className = 'answer-box';
    startTimer();
    if(mode === 'online') scheduleAI(levelB === 'hard');
    else showThinking(false);
  }

  // ---- AI opponent (Play Online mode) : speed adapts to how the user is actually playing ----
  // Genuinely randomized — no fixed "addition = X seconds" rule, so it doesn't
  // feel mechanical. Slightly weighted by how big the numbers are and by how
  // the user is doing, but the spread is wide enough that no two questions
  // (even the same type) play out the same way.
  function aiThinkTime(q, assist){
    const totalTries = userCorrectCount + userWrongCount;
    const missRate = totalTries ? (userWrongCount / totalTries) : 0;

    const digits = String(q.a).length + (q.b ? String(q.b).length : 0);
    let baseTime = randInt(1800, 6200) + digits * randInt(250, 550);
    baseTime += missRate * randInt(700, 2600);           // user struggling → AI eases off, unpredictably
    if(assist) baseTime += 1800 + randInt(300, 2200);     // mid-round comeback assist
    const extraSlip = missRate * 0.35;

    return { time: Math.max(1200, Math.min(baseTime, 12000)), extraSlip: extraSlip };
  }

  function scheduleAI(assist){
    clearTimeout(aiTimeout);
    if(mode !== 'online') return;
    showThinking(true);
    const think = aiThinkTime(qB, assist);
    const baseTime = think.time;
    const makesSlip = Math.random() < Math.min(0.85, (assist ? 0.55 : 0.22) + think.extraSlip);

    if(makesSlip){
      const slipDelay = Math.max(600, baseTime - 900);
      aiTimeout = setTimeout(function(){
        if(!roundActive || gameOver || mode !== 'online') return;
        const correctNum = parseInt(qB.answer, 10);
        const delta = randInt(1,3) * (Math.random() < 0.5 ? -1 : 1);
        const wrongVal = String(Math.max(0, correctNum + delta));
        answerB = wrongVal;
        ansBEl.textContent = wrongVal;
        submitAnswer('B');
        aiTimeout = setTimeout(function(){
          if(!roundActive || gameOver || mode !== 'online') return;
          answerB = qB.answer;
          ansBEl.textContent = answerB;
          showThinking(false);
          submitAnswer('B');
        }, 500 + randInt(200,600));
      }, slipDelay);
    } else {
      aiTimeout = setTimeout(function(){
        if(!roundActive || gameOver || mode !== 'online') return;
        answerB = qB.answer;
        ansBEl.textContent = answerB;
        showThinking(false);
        submitAnswer('B');
      }, baseTime);
    }
  }

  let lastTickSec = -1;
  function startTimer(){
    cancelAnimationFrame(timerRAF);
    timerStart = performance.now();
    lastTickSec = -1;
    function tick(now){
      if(!roundActive) return;
      const left = Math.max(0, ROUND_TIME - (now - timerStart));
      timerFill.style.width = (left / ROUND_TIME * 100) + '%';
      const secLeft = Math.ceil(left/1000);
      timeText.textContent = '00:' + String(secLeft).padStart(2,'0');
      if(secLeft <= 3 && secLeft !== lastTickSec){ lastTickSec = secLeft; SFX.tick(); }
      if(left <= 0){
        if(mode === 'online'){ userRoundStreak = 0; userMissStreak++; }
        newRound();
        return;
      }
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function submitAnswer(side){
    if(!roundActive || gameOver) return;
    const val   = side === 'A' ? answerA : answerB;
    const q     = side === 'A' ? qA : qB;
    const ansEl = side === 'A' ? ansAEl : ansBEl;
    if(val === '') return;

    if(val === q.answer){
      // Pity guard: after a couple of losses in a row, the AI just can't quite
      // land the finishing pull this game — keeps things from feeling unfair.
      if(side === 'B' && pityActive && (position + 1) >= LIMIT){
        SFX.wrong();
        ansEl.textContent = val;
        ansEl.className = 'answer-box bad';
        setTimeout(function(){
          ansEl.className = 'answer-box';
          answerB = ''; ansBEl.textContent = '';
        }, 340);
        return;
      }

      roundActive = false;
      cancelAnimationFrame(timerRAF);
      SFX.correct();
      ansEl.className = 'answer-box ok';
      const box = side === 'A' ? padBoxA : padBoxB;
      box.classList.add('flash');
      setTimeout(function(){ box.classList.remove('flash'); }, 500);

      if(side === 'A'){
        solvedA++;
        position = Math.max(-LIMIT, position - 1);
        wrongStreakA = 0;
        userCorrectCount++;
        const elapsed = performance.now() - roundStartTime;
        userTimeSamples.push(elapsed);
        if(userTimeSamples.length > 5) userTimeSamples.shift();
        // From the 3rd game onward, playing well enough (25+ solved) earns the win
        if(mode === 'online' && userGamesPlayed >= 3 && solvedA >= 25) pityActive = true;

        if(mode === 'online'){
          userMissStreak = 0;
          userRoundStreak++;
          // Early hot streak (still under ~6-7 solved) — throw a couple of hard ones in
          if(userRoundStreak >= 3 && solvedA <= 8) hardBurstRounds = 2;
        }
      } else {
        solvedB++;
        position = Math.min(LIMIT, position + 1);
        if(mode === 'online'){
          userRoundStreak = 0;
          userMissStreak++;
          // Well into the match but cold for 3 rounds straight — let the AI actually close it out
          if(userMissStreak >= 3 && solvedA > 20) pityActive = false;
        }
      }
      totalSolved++;
      updateVisual();
      setTimeout(function(){
        if(Math.abs(position) >= LIMIT) endGame(position < 0 ? 'A' : 'B');
        else newRound();
      }, 620);
    } else {
      SFX.wrong();
      ansEl.textContent = val;
      ansEl.className = 'answer-box bad';
      if(side === 'A'){
        wrongStreakA++;
        userWrongCount++;
        if(wrongStreakA >= 2 && mode === 'online' && !aiHandicappedThisRound && roundActive){
          aiHandicappedThisRound = true;
          helpUserNextRound = true; // next round: easier question for the user, harder for the AI
        }
      }
      setTimeout(function(){
        ansEl.className = 'answer-box';
        if(side === 'A'){ answerA = ''; ansAEl.textContent = ''; }
        else { answerB = ''; ansBEl.textContent = ''; }
      }, 340);
    }
  }

  function handleKey(side, key){
    if(!roundActive || gameOver) return;
    if(side === 'B' && mode === 'online') return; // AI controls this side in online mode
    if(key !== 'ok') SFX.key();
    if(side === 'A'){
      if(key === 'del') answerA = answerA.slice(0,-1);
      else if(key === 'ok'){ submitAnswer('A'); return; }
      else if(answerA.length < 4) answerA += key;
      ansAEl.textContent = answerA;
      if(qA && answerA.length === qA.answer.length) submitAnswer('A');
    } else {
      if(key === 'del') answerB = answerB.slice(0,-1);
      else if(key === 'ok'){ submitAnswer('B'); return; }
      else if(answerB.length < 4) answerB += key;
      ansBEl.textContent = answerB;
      if(qB && answerB.length === qB.answer.length) submitAnswer('B');
    }
  }

  function buildPad(container, side){
    const keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
    container.innerHTML = '';
    keys.forEach(function(k){
      const btn = document.createElement('div');
      btn.className = 'key';
      if(k === 'del'){ btn.classList.add('back'); btn.textContent = '⌫'; }
      else if(k === 'ok'){ btn.classList.add('go'); btn.textContent = '✓'; }
      else btn.textContent = k;
      // touchstart so two players tapping at the same instant both register
      btn.addEventListener('touchstart', function(e){
        e.preventDefault();
        handleKey(side, k);
      }, {passive:false});
      btn.addEventListener('click', function(){ handleKey(side, k); });
      container.appendChild(btn);
    });
  }

  function endGame(winner){
    gameOver = true;
    roundActive = false;
    cancelAnimationFrame(timerRAF);
    clearTimeout(aiTimeout);
    showThinking(false);
    SFX.win();
    const winnerName = winner === 'A' ? teamNameAEl.textContent : teamNameBEl.textContent;
    winTitle.textContent = winnerName + ' wins!';
    winSub.textContent = 'Solved ' + (winner === 'A' ? solvedA : solvedB) + ' problems and pulled the ribbon across.';
    overlay.classList.add('show');
  }

  function resetGame(){
    position = 0; gameOver = false;
    solvedA = 0; solvedB = 0;
    wrongStreakA = 0; aiHandicappedThisRound = false; helpUserNextRound = false;
    userTimeSamples = [];
    userCorrectCount = 0; userWrongCount = 0; totalSolved = 0;
    userRoundStreak = 0; userMissStreak = 0; hardBurstRounds = 0;

    if(mode === 'online'){
      userGamesPlayed++;
      // The user's very first game plays out naturally. Their 2nd game is a
      // guaranteed win (keeps a brand-new player from bouncing off a loss
      // streak). From the 3rd game on, a win has to be earned — see the
      // 25-solved check in submitAnswer.
      pityActive = (userGamesPlayed === 2);
    } else {
      pityActive = false;
    }
    updateVisual();
    overlay.classList.remove('show');
    newRound();
  }

  function setMode(m){
    mode = m;
    if(m === 'friend'){
      teamNameAEl.textContent = 'Team A';
      teamNameBEl.textContent = 'Team B';
      padTitleAEl.textContent = 'Team A';
      padTitleBEl.textContent = 'Team B';
      padBoxB.classList.remove('ai-mode');
    } else {
      teamNameAEl.textContent = playerName;
      teamNameBEl.textContent = opponentName;
      padTitleAEl.textContent = playerName;
      padTitleBEl.textContent = opponentName;
      padBoxB.classList.add('ai-mode');
    }
    modeOverlay.classList.remove('show');
    nameOverlay.classList.remove('show');
    resetGame();
  }

  buildPad(document.getElementById('padA'), 'A');
  buildPad(document.getElementById('padB'), 'B');
  document.getElementById('playAgainBtn').addEventListener('click', resetGame);

  function shareScore(){
    const solved = solvedA;
    const text = 'I solved ' + solved + ' questions in Brain Exercise: Math Tug of War! Can you beat my score?';
    const url = 'https://t.me/Mathtugofwar_bot';
    const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
    if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink){
      window.Telegram.WebApp.openTelegramLink(shareUrl);
    } else if(navigator.share){
      navigator.share({ title:'Brain Exercise', text:text, url:url }).catch(function(){});
    } else {
      window.open(shareUrl, '_blank');
    }
  }
  document.getElementById('shareBtn').addEventListener('click', shareScore);

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', function(){
    const on = !SFX.isEnabled();
    SFX.setEnabled(on);
    if(on){ SFX.unlock(); muteBtn.textContent = '🔊'; muteBtn.classList.remove('muted'); }
    else { muteBtn.textContent = '🔇'; muteBtn.classList.add('muted'); }
  });

  // ---- mode selection ----
  document.getElementById('btnFriend').addEventListener('click', function(){
    SFX.unlock();
    setMode('friend');
  });
  document.getElementById('btnOnline').addEventListener('click', function(){
    SFX.unlock();
    modeOverlay.classList.remove('show');
    nameOverlay.classList.add('show');
    setTimeout(function(){ nameInput.focus(); }, 200);
  });
  function startOnline(){
    const val = nameInput.value.trim();
    playerName = val ? val.slice(0,14) : 'Aap';
    opponentName = INDIAN_NAMES[randInt(0, INDIAN_NAMES.length - 1)];
    setMode('online');
  }
  document.getElementById('btnStartOnline').addEventListener('click', startOnline);
  nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') startOnline(); });

  document.getElementById('modeBtn').addEventListener('click', function(){
    cancelAnimationFrame(timerRAF);
    clearTimeout(aiTimeout);
    showThinking(false);
    gameOver = true;
    overlay.classList.remove('show');
    nameOverlay.classList.remove('show');
    modeOverlay.classList.add('show');
  });

  updateVisual();
})();
</script>
