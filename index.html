<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brain Exercise — Math Tug of War</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1F62C9;
    --blue-soft:#3E84E6;
    --red:#D93B3B;
    --navy:#12386B;
    --navy-deep:#0C2748;
    --sky-1:#8FC7F0;
    --sky-2:#C8E6F8;
    --sand:#D9B98A;
    --sand-dark:#BE9968;
    --grass:#6FB23F;
    --grass-dark:#4F8C2B;
    --gold:#F5C542;
    --gold-dark:#D19A16;
    --green-ok:#3BA55D;
    --ink:#0F2440;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--navy-deep);
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--ink);
  }

  /* The game lives on ONE fixed canvas (900 x 560).
     JS scales that whole canvas to fit the screen it opens on,
     so phone / tablet / laptop all see identical proportions. */
  .viewport{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    position:relative;
    width:900px;
    height:560px;
    flex:0 0 auto;
    transform-origin:center center;
    display:flex;
    flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(180deg,
      var(--sky-1) 0%, var(--sky-2) 33%,
      var(--sand) 33%, var(--sand-dark) 63%,
      var(--grass) 63%, var(--grass-dark) 100%);
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }

  /* ---------- TOP HUD ---------- */
  .hud{
    flex:0 0 96px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 14px 0;
  }
  .team-card{
    flex:1 1 0;
    min-width:0;
    border-radius:16px;
    padding:9px 16px 10px;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .team-a{ background:linear-gradient(180deg,var(--blue-soft),var(--blue)); }
  .team-b{ background:linear-gradient(180deg,#E85C5C,var(--red)); text-align:right; }
  .team-name{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:21px;
    line-height:1.15;
  }
  .team-score{
    font-size:14px;
    font-weight:700;
    opacity:.95;
    line-height:1.3;
  }
  .pull-bar{
    height:9px;
    border-radius:99px;
    background:rgba(0,0,0,.3);
    overflow:hidden;
    margin-top:5px;
  }
  .pull-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    transition:width .45s ease;
  }
  .team-a .pull-fill{ background:linear-gradient(90deg,#8FE86B,#4FCB2F); }
  .team-b .pull-fill{ background:linear-gradient(90deg,#FF8B6B,#FF5A3C); margin-left:auto; }

  .timer-pod{
    flex:0 0 150px;
    background:linear-gradient(180deg,#2C5A9E,var(--navy));
    border-radius:16px;
    padding:7px 14px 8px;
    text-align:center;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .timer-time{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:26px;
    line-height:1;
  }
  .timer-label{ font-size:11px; opacity:.85; font-weight:700; margin-top:1px; }
  .timer-track{
    height:5px;
    border-radius:99px;
    background:rgba(0,0,0,.35);
    margin-top:5px;
    overflow:hidden;
  }
  .timer-fill{
    height:100%;
    width:100%;
    background:var(--gold);
    transition:width .1s linear;
  }
  .restart-mini{
    display:block;
    margin:6px auto 0;
    font-family:'Quicksand',sans-serif;
    font-size:11px;
    font-weight:800;
    padding:3px 12px;
    border-radius:99px;
    border:2px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.14);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  .restart-mini:active{ transform:translateY(1px); }

  /* ---------- ARENA ---------- */
  .arena{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }
  .flag{
    position:absolute;
    top:10px;
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:30px;
    color:#fff;
    width:58px; height:48px;
    display:flex; align-items:center; justify-content:center;
    clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
    text-shadow:0 2px 3px rgba(0,0,0,.3);
  }
  .flag-a{ left:44px; background:var(--blue); }
  .flag-b{ right:44px; background:var(--red); }
  .flag::after{
    content:'';
    position:absolute;
    left:-6px; top:0;
    width:5px; height:135%;
    background:#8A6A44;
    border-radius:2px;
  }
  .flag-b::after{ left:auto; right:-6px; }

  .q-card{
    position:absolute;
    top:0px;
    background:#fff;
    border:4px solid var(--blue);
    border-radius:16px;
    padding:6px 22px 9px;
    text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.2);
    min-width:180px;
    z-index:5;
  }
  .q-card.q-b{ border-color:var(--red); }
  .q-label{ font-size:12px; font-weight:700; color:#5A7391; line-height:1.2; }
  .q-text{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:30px;
    line-height:1.15;
    color:var(--navy);
    white-space:nowrap;
  }
  .q-a{ left:150px; }
  .q-b{ right:150px; }

  .rope-zone{
    position:absolute;
    left:0; right:0;
    bottom:34px;
    height:0;
  }
  .rope{
    position:absolute;
    left:60px; right:60px;
    top:0;
    height:11px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(72deg,#C79A5E 0 6px,#A87A42 6px 12px);
    border-radius:99px;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.28);
  }
  .ribbon{
    position:absolute;
    top:0;
    width:26px; height:30px;
    transform:translate(-50%,-52%);
    transition:left .5s cubic-bezier(.34,1.4,.64,1);
    z-index:4;
    background:var(--red);
    clip-path:polygon(50% 0,100% 18%,72% 55%,100% 100%,50% 62%,0 100%,28% 55%,0 18%);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
  }

  /* ---------- CONTROLS (bigger now that character space is freed up) ---------- */
  .controls{
    flex:0 0 270px;
    display:flex;
    gap:16px;
    padding:8px 16px 14px;
    background:linear-gradient(180deg,rgba(12,39,72,0) 0%, var(--navy-deep) 16%);
  }
  .pad-box{
    flex:1 1 0;
    min-width:0;
    background:linear-gradient(180deg,#F4F8FE,#DCE8F7);
    border:4px solid var(--blue);
    border-radius:18px;
    padding:8px 10px 10px;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
  }
  .pad-b{ border-color:var(--red); }
  .pad-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:7px;
  }
  .pad-b .pad-head{ flex-direction:row-reverse; }
  .pad-title{
    font-size:14px;
    font-weight:800;
    color:var(--navy);
    white-space:nowrap;
  }
  .answer-box{
    flex:1 1 auto;
    min-width:0;
    background:#fff;
    border:3px solid #B9CEE6;
    border-radius:12px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    letter-spacing:1px;
  }
  .answer-box.ok{ border-color:var(--green-ok); color:var(--green-ok); background:#EDFBF1; }
  .answer-box.bad{ border-color:var(--red); color:var(--red); background:#FDEDED; animation:shake .3s; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    30%{transform:translateX(-7px);}
    70%{transform:translateX(7px);}
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    font-family:'Fredoka',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--navy);
    background:#fff;
    border:3px solid #C3D6EC;
    border-radius:13px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    box-shadow:0 3px 0 #B0C6DF;
  }
  .key:active{ transform:translateY(3px); box-shadow:none; }
  .key.back{ background:var(--navy); color:#fff; border-color:#071A31; box-shadow:0 3px 0 #071A31; font-size:22px; }
  .key.go{ background:var(--green-ok); color:#fff; border-color:#2C8247; box-shadow:0 3px 0 #24693A; font-size:22px; }

  .pad-box.flash{ animation:pop .5s ease; }
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.03);}
    100%{transform:scale(1);}
  }

  /* ---------- WIN OVERLAY ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(8,24,45,.74);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
  }
  .overlay.show{ display:flex; }
  .win-card{
    background:linear-gradient(180deg,#F7FBFF,#DCE9F8);
    border:5px solid var(--gold);
    border-radius:22px;
    padding:24px 40px 26px;
    text-align:center;
    max-width:440px;
    box-shadow:0 10px 0 rgba(0,0,0,.35);
  }
  .win-trophy{ font-size:58px; line-height:1; }
  .win-card h2{
    font-family:'Fredoka',cursive;
    font-size:30px;
    margin:8px 0 4px;
    color:var(--navy);
  }
  .win-card p{ margin:0 0 16px; font-size:15px; color:#4C6A8C; font-weight:600; }
  .play-again{
    font-family:'Fredoka',cursive;
    font-weight:800;
    font-size:19px;
    padding:11px 32px;
    border-radius:99px;
    border:4px solid var(--gold-dark);
    background:var(--gold);
    color:var(--navy);
    cursor:pointer;
    box-shadow:0 5px 0 var(--gold-dark);
  }
  .play-again:active{ transform:translateY(4px); box-shadow:none; }
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">

  <div class="hud">
    <div class="team-card team-a">
      <div class="team-name">Team A</div>
      <div class="team-score">Solved: <span id="solvedA">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullA"></div></div>
    </div>

    <div class="timer-pod">
      <div class="timer-time" id="timeText">00:10</div>
      <div class="timer-label">Time left</div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <button class="restart-mini" id="restartBtn">↻ Restart</button>
    </div>

    <div class="team-card team-b">
      <div class="team-name">Team B</div>
      <div class="team-score">Solved: <span id="solvedB">0</span></div>
      <div class="pull-bar"><div class="pull-fill" id="pullB"></div></div>
    </div>
  </div>

  <div class="arena">
    <div class="flag flag-a">A</div>
    <div class="flag flag-b">B</div>

    <div class="q-card q-a">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qA">8 + 7 = ?</div>
    </div>
    <div class="q-card q-b">
      <div class="q-label">Solve this</div>
      <div class="q-text" id="qB">6 × 3 = ?</div>
    </div>

    <div class="rope-zone">
      <div class="rope"></div>
      <div class="ribbon" id="ribbon" style="left:50%"></div>
    </div>
  </div>

  <div class="controls">
    <div class="pad-box pad-a" id="padBoxA">
      <div class="pad-head">
        <div class="pad-title">Team A</div>
        <div class="answer-box" id="ansA"></div>
      </div>
      <div class="keypad" id="padA"></div>
    </div>

    <div class="pad-box pad-b" id="padBoxB">
      <div class="pad-head">
        <div class="pad-title">Team B</div>
        <div class="answer-box" id="ansB"></div>
      </div>
      <div class="keypad" id="padB"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="win-trophy">🏆</div>
      <h2 id="winTitle">Team A wins!</h2>
      <p id="winSub">Pulled the ribbon all the way over.</p>
      <button class="play-again" id="playAgainBtn">Play again</button>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  // ---- play counter ----
  (function trackPlay(){
    try{
      const key = location.origin + location.pathname;
      fetch('https://hits-app.vercel.app/hits?url=' + encodeURIComponent(key) + '&json').catch(()=>{});
    }catch(e){}
  })();

  // ---- Telegram Mini App setup ----
  if(window.Telegram && window.Telegram.WebApp){
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try{ tg.disableVerticalSwipes(); }catch(e){}
    try{ tg.setHeaderColor('#0C2748'); }catch(e){}
    try{ tg.setBackgroundColor('#0C2748'); }catch(e){}
    try{ tg.requestFullscreen(); }catch(e){}
  }

  // ---- FIT THE FIXED CANVAS TO ANY SCREEN ----
  // The design size never changes, so nothing can overlap and nothing
  // balloons on a big screen. Only the zoom level changes per device.
  const DESIGN_W = 900, DESIGN_H = 560;
  const MAX_SCALE = 1.3;   // keeps the keypad from getting huge on laptops
  const stage = document.getElementById('stage');

  function fitStage(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // A tall screen (phone held upright) gets the canvas turned sideways,
    // so the player just rotates the phone and everything already fits.
    const rotate = vh > vw;
    const availW = rotate ? vh : vw;
    const availH = rotate ? vw : vh;
    let scale = Math.min(availW / DESIGN_W, availH / DESIGN_H) * 0.98;
    scale = Math.min(scale, MAX_SCALE);
    stage.style.transform = (rotate ? 'rotate(90deg) ' : '') + 'scale(' + scale + ')';
  }
  fitStage();
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 200); });

  // ---- game state ----
  const LIMIT = 5;
  const ROUND_TIME = 10000;

  let position = 0;
  let roundActive = true;
  let gameOver = false;
  let qA, qB;
  let answerA = '', answerB = '';
  let solvedA = 0, solvedB = 0;
  let timerStart, timerRAF;

  const ribbon    = document.getElementById('ribbon');
  const qAEl      = document.getElementById('qA');
  const qBEl      = document.getElementById('qB');
  const ansAEl    = document.getElementById('ansA');
  const ansBEl    = document.getElementById('ansB');
  const padBoxA   = document.getElementById('padBoxA');
  const padBoxB   = document.getElementById('padBoxB');
  const pullA     = document.getElementById('pullA');
  const pullB     = document.getElementById('pullB');
  const solvedAEl = document.getElementById('solvedA');
  const solvedBEl = document.getElementById('solvedB');
  const timerFill = document.getElementById('timerFill');
  const timeText  = document.getElementById('timeText');
  const overlay   = document.getElementById('overlay');
  const winTitle  = document.getElementById('winTitle');
  const winSub    = document.getElementById('winSub');

  function updateVisual(){
    ribbon.style.left = (50 + position * 7.2) + '%';
    pullA.style.width = (Math.max(0, -position) / LIMIT * 100) + '%';
    pullB.style.width = (Math.max(0,  position) / LIMIT * 100) + '%';
    solvedAEl.textContent = solvedA;
    solvedBEl.textContent = solvedB;
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function makeQuestion(){
    const ops = ['+','-','×','÷'];
    const op = ops[randInt(0,3)];
    let a,b,answer,text;
    if(op === '+'){
      a = randInt(2,30); b = randInt(2,30);
      answer = a+b; text = a+' + '+b;
    } else if(op === '-'){
      a = randInt(5,40); b = randInt(1,a);
      answer = a-b; text = a+' − '+b;
    } else if(op === '×'){
      a = randInt(2,12); b = randInt(2,10);
      answer = a*b; text = a+' × '+b;
    } else {
      b = randInt(2,10); answer = randInt(2,12); a = b*answer;
      text = a+' ÷ '+b;
    }
    return {text:text, answer:String(answer)};
  }

  function newRound(){
    if(gameOver) return;
    roundActive = true;
    answerA = ''; answerB = '';
    qA = makeQuestion();
    qB = makeQuestion();
    qAEl.textContent = qA.text + ' = ?';
    qBEl.textContent = qB.text + ' = ?';
    ansAEl.textContent = ''; ansAEl.className = 'answer-box';
    ansBEl.textContent = ''; ansBEl.className = 'answer-box';
    startTimer();
  }

  function startTimer(){
    cancelAnimationFrame(timerRAF);
    timerStart = performance.now();
    function tick(now){
      if(!roundActive) return;
      const left = Math.max(0, ROUND_TIME - (now - timerStart));
      timerFill.style.width = (left / ROUND_TIME * 100) + '%';
      timeText.textContent = '00:' + String(Math.ceil(left/1000)).padStart(2,'0');
      if(left <= 0){ newRound(); return; }
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function submitAnswer(side){
    if(!roundActive || gameOver) return;
    const val   = side === 'A' ? answerA : answerB;
    const q     = side === 'A' ? qA : qB;
    const ansEl = side === 'A' ? ansAEl : ansBEl;
    if(val === '') return;

    if(val === q.answer){
      roundActive = false;
      cancelAnimationFrame(timerRAF);
      ansEl.className = 'answer-box ok';
      const box = side === 'A' ? padBoxA : padBoxB;
      box.classList.add('flash');
      setTimeout(function(){ box.classList.remove('flash'); }, 500);

      if(side === 'A'){
        solvedA++;
        position = Math.max(-LIMIT, position - 1);
      } else {
        solvedB++;
        position = Math.min(LIMIT, position + 1);
      }
      updateVisual();
      setTimeout(function(){
        if(Math.abs(position) >= LIMIT) endGame(position < 0 ? 'A' : 'B');
        else newRound();
      }, 620);
    } else {
      ansEl.textContent = val;
      ansEl.className = 'answer-box bad';
      setTimeout(function(){
        ansEl.className = 'answer-box';
        if(side === 'A'){ answerA = ''; ansAEl.textContent = ''; }
        else { answerB = ''; ansBEl.textContent = ''; }
      }, 340);
    }
  }

  function handleKey(side, key){
    if(!roundActive || gameOver) return;
    if(side === 'A'){
      if(key === 'del') answerA = answerA.slice(0,-1);
      else if(key === 'ok'){ submitAnswer('A'); return; }
      else if(answerA.length < 4) answerA += key;
      ansAEl.textContent = answerA;
      if(qA && answerA.length === qA.answer.length) submitAnswer('A');
    } else {
      if(key === 'del') answerB = answerB.slice(0,-1);
      else if(key === 'ok'){ submitAnswer('B'); return; }
      else if(answerB.length < 4) answerB += key;
      ansBEl.textContent = answerB;
      if(qB && answerB.length === qB.answer.length) submitAnswer('B');
    }
  }

  function buildPad(container, side){
    const keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
    container.innerHTML = '';
    keys.forEach(function(k){
      const btn = document.createElement('div');
      btn.className = 'key';
      if(k === 'del'){ btn.classList.add('back'); btn.textContent = '⌫'; }
      else if(k === 'ok'){ btn.classList.add('go'); btn.textContent = '✓'; }
      else btn.textContent = k;
      // touchstart so two players tapping at the same instant both register
      btn.addEventListener('touchstart', function(e){
        e.preventDefault();
        handleKey(side, k);
      }, {passive:false});
      btn.addEventListener('click', function(){ handleKey(side, k); });
      container.appendChild(btn);
    });
  }

  function endGame(winner){
    gameOver = true;
    roundActive = false;
    cancelAnimationFrame(timerRAF);
    winTitle.textContent = winner === 'A' ? 'Team A wins!' : 'Team B wins!';
    winSub.textContent = 'Solved ' + (winner === 'A' ? solvedA : solvedB) + ' problems and pulled the ribbon across.';
    overlay.classList.add('show');
  }

  function resetGame(){
    position = 0; gameOver = false;
    solvedA = 0; solvedB = 0;
    updateVisual();
    overlay.classList.remove('show');
    newRound();
  }

  buildPad(document.getElementById('padA'), 'A');
  buildPad(document.getElementById('padB'), 'B');
  document.getElementById('playAgainBtn').addEventListener('click', resetGame);
  document.getElementById('restartBtn').addEventListener('click', resetGame);

  updateVisual();
  newRound();
})();
</script>

</body>
</html>
